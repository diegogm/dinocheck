# Example Custom Rule for Dinocheck
# Copy this file to .dinocheck/rules/ and adapt it to your project.
#
# How a rule works: `dino brief` selects rules whose triggers match the files
# under review and hands them to your coding agent. The agent then evaluates
# the checklist semantically against the code - the regexes below are only a
# cheap pre-filter, not the analysis itself.

id: custom/example-rule
name: Example Custom Rule
# Severity guide:
#   blocker  - data loss or catastrophic security issue
#   critical - serious security issue (leaked secrets, injection)
#   major    - bugs or performance problems
#   minor    - maintainability concerns
#   info     - style suggestions
level: major
category: custom

# 2-4 sentences: WHAT the rule detects and WHY it matters.
# The agent reads this to understand intent, so be specific.
description: |
  Detects calls to dangerous_function() with data that originates from user
  input. Unsanitized input reaching this sink allows attackers to execute
  arbitrary operations. Every call site must sanitize its arguments first.

# 3-6 concrete, answerable questions the agent verifies against the code.
# Good items are specific ("Is X passed to Y without Z?"); avoid vague items
# like "Is the code secure?".
checklist:
  - Is dangerous_function() called with a value derived from user input (request data, CLI args, file contents)?
  - Is the input passed through sanitize() (or an equivalent validator) before reaching the sink?
  - Are there call paths that bypass validation, e.g. helper functions that forward arguments unchecked?
  - Does error handling avoid leaking the raw unsanitized input back to the user?

# Actionable guidance: shown to developers and used by the agent to judge
# whether code is already correct. Name the exact APIs to use.
fix: |
  Sanitize all external input with sanitize() before passing it on, or
  switch to safe_function(), which validates internally. Centralize the
  validation at the entry point so no call path can skip it.

tags:
  - custom
  - example

triggers:
  # File patterns (fnmatch globs). "**/x" matches at any depth, including
  # the repository root. The rule is only considered for matching files.
  file_patterns:
    - "**/views.py"
    - "**/api/*.py"

  # Code patterns: Python re.search regexes applied to the FULL file content
  # (single pass, no re.MULTILINE - so `^`/`$` only anchor the start/end of
  # the file; prefer \b or \n for line-ish anchoring). If any pattern
  # matches, the rule is included in the brief. Keep them cheap and
  # reasonably specific; at least one should match your own `bad` example.
  code_patterns:
    - "\\bdangerous_function\\("
    - "\\bunsafe_operation\\("

# A minimal, self-contained bad/good pair. The agent uses it to calibrate
# what counts as a violation and what a correct fix looks like.
examples:
  bad: |
    def process_data(user_input):
        dangerous_function(user_input)  # unsanitized input reaches the sink
  good: |
    def process_data(user_input):
        sanitized = sanitize(user_input)
        safe_function(sanitized)  # validated before use
