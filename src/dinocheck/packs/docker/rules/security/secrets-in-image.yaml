id: docker/secrets-in-image
name: Secrets baked into image
level: critical
category: security
description: |
  Detects credentials (passwords, API keys, tokens, private keys) embedded in
  the image via ENV, ARG, COPY or ADD. Anyone who can pull the image can
  extract them with docker history or by inspecting layers - deleting the
  file in a later layer does NOT remove it, and ARG values are recorded in
  image history. Leaked registry images are a common source of credential
  compromise.
checklist:
  - Does any ENV instruction assign a literal sensitive value (password, token, key), rather than just declaring the variable name?
  - Is ARG used to pass secrets (they persist in docker history even if unset later)?
  - Do COPY/ADD instructions bring in .env files, private keys (id_rsa, *.pem), or cloud credential files?
  - Are secrets written in a RUN step and "deleted" in a later layer (they remain in the earlier layer)?
  - Do copied config files contain hardcoded credentials?
fix: |
  Never bake secrets into layers. Inject them at runtime instead:
    docker run -e DATABASE_PASSWORD ... or an orchestrator secret store.
  For secrets needed only at build time, use BuildKit secret mounts:
    RUN --mount=type=secret,id=npm_token npm ci
  Add .env, key and credential files to .dockerignore so COPY . cannot pick
  them up. If a secret has already been pushed in an image, rotate it.

tags:
  - docker
  - security
  - secrets

triggers:
  file_patterns:
    - "**/Dockerfile"
    - "**/Dockerfile.*"
    - "**/*.dockerfile"
  code_patterns:
    - "(?i)\\bENV\\s+\\w*(PASSWORD|PASSWD|SECRET|TOKEN|API_?KEY|PRIVATE_?KEY)\\w*\\s*[= ]"
    - "(?i)\\bARG\\s+\\w*(PASSWORD|PASSWD|SECRET|TOKEN|API_?KEY)\\w*"
    - "(COPY|ADD)\\s+[^\\n]*\\.env\\b"
    - "(COPY|ADD)\\s+[^\\n]*(id_rsa|id_ed25519|\\.pem\\b|credentials)"

examples:
  bad: |
    FROM python:3.11-slim
    ENV DATABASE_PASSWORD=supersecret123
    ARG API_KEY=abc123xyz
    COPY .env /app/.env
  good: |
    FROM python:3.11-slim
    # Secret provided at runtime: docker run -e DATABASE_PASSWORD ...
    # Build-time secret via BuildKit, never stored in a layer:
    RUN --mount=type=secret,id=api_key \
        API_KEY="$(cat /run/secrets/api_key)" python fetch_assets.py
