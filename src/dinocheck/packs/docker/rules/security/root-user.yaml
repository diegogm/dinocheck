id: docker/root-user
name: Container running as root
level: major
category: security
description: |
  Detects images whose final stage runs as root (the Docker default when no
  USER instruction is present). If the application is compromised, the
  attacker gets UID 0 inside the container, which amplifies kernel and
  runtime escape vulnerabilities and gives write access to anything mounted
  from the host. Running as a dedicated non-root user is a cheap,
  high-value hardening measure.
checklist:
  - Is there no USER instruction in the final stage, or is the last USER root/0?
  - Does the image create a dedicated unprivileged user (useradd/adduser) and switch to it before ENTRYPOINT/CMD?
  - Are files the app needs owned by that user (COPY --chown or chown in a RUN step)?
  - Does the service genuinely need root (e.g. binding ports <1024 without NET_BIND_SERVICE, managing devices), and is that documented?
  - In multi-stage builds, does the check apply to the final runtime stage (builder stages may stay root)?
fix: |
  Create and switch to a non-root user in the final stage:
    RUN useradd -r -u 1001 appuser
    COPY --chown=appuser:appuser . /app
    USER appuser
  If the app must listen on a port below 1024, listen on a high port instead
  and map it, or grant only cap_net_bind_service at runtime. Some base images
  ship a ready-made user (node, nginx-unprivileged) - prefer those.

tags:
  - docker
  - security
  - container

triggers:
  file_patterns:
    - "**/Dockerfile"
    - "**/Dockerfile.*"
    - "**/*.dockerfile"
  code_patterns:
    - "FROM\\s+\\S+"

examples:
  bad: |
    FROM python:3.11-slim
    COPY . /app
    CMD ["python", "app.py"]
  good: |
    FROM python:3.11-slim
    RUN useradd -r -u 1001 appuser
    COPY --chown=appuser:appuser . /app
    USER appuser
    CMD ["python", "app.py"]
