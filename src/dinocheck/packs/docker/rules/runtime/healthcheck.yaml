id: docker/missing-healthcheck
name: Missing HEALTHCHECK instruction
level: minor
category: reliability
description: |
  Detects Dockerfiles for long-running services that define no HEALTHCHECK
  instruction. Without it, Docker and orchestrators only know that the process
  exists, not that the application works: a container can stay "running" while
  the app is deadlocked, out of connections, or returning errors. A health
  check enables automatic recovery and correct startup ordering (e.g.
  depends_on with condition service_healthy in Compose).
checklist:
  - Does the final image run a long-lived service (server, worker, daemon) rather than a one-shot CLI or build tool?
  - Is there no HEALTHCHECK instruction in the final build stage?
  - Does the image EXPOSE a port or start a network listener without any liveness probe?
  - If a HEALTHCHECK exists, does it verify real application behavior (endpoint, query) instead of just process existence?
  - Are --interval, --timeout, --retries and --start-period sensible for the app's startup time?
fix: |
  Add a HEALTHCHECK in the final stage that exercises the application, e.g.:
  HEALTHCHECK --interval=30s --timeout=3s --start-period=10s --retries=3 \
    CMD curl -fsS http://localhost:8000/health || exit 1
  If curl/wget is not in the image, ship a tiny healthcheck script or use the
  runtime's own client (pg_isready, redis-cli ping, node healthcheck.js).
  One-shot images (CLI tools, builders) do not need a HEALTHCHECK.

tags:
  - docker
  - reliability
  - observability

triggers:
  file_patterns:
    - "**/Dockerfile"
    - "**/Dockerfile.*"
    - "**/*.dockerfile"
  code_patterns:
    - "\\bEXPOSE\\s+\\d"
    - "\\n(CMD|ENTRYPOINT)[\\s\\[]"

examples:
  bad: |
    FROM python:3.11-slim
    EXPOSE 8000
    CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
  good: |
    FROM python:3.11-slim
    EXPOSE 8000
    HEALTHCHECK --interval=30s --timeout=3s --start-period=10s --retries=3 \
      CMD curl -fsS http://localhost:8000/health || exit 1
    CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
