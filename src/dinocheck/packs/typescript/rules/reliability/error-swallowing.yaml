id: typescript/error-swallowing
name: Silent error swallowing
level: major
category: reliability
description: |
  Detects catch blocks that hide failures: empty catches, catches that only
  console.log, or handlers that neither recover nor rethrow. The program then
  continues in an unknown state — data may be half-saved, the user sees
  success after a failure, and production bugs leave no usable trace.
checklist:
  - Is there an empty catch block (catch {} or catch (e) {})?
  - Does the catch only console.log the error without recovering, notifying the user, or rethrowing?
  - After the catch, does the code continue as if the operation succeeded?
  - Does the handler distinguish expected errors (e.g. 404, AbortError) from unexpected ones, or swallow everything?
  - Is the original error preserved (cause, logging with context) when wrapped or rethrown?
fix: |
  Decide per call site: recover (retry, fallback value, user-facing message),
  or propagate — rethrow, or wrap with context using
  `throw new AppError('...', { cause: e })`. Report unexpected errors to the
  error-tracking service, not just console.log. If ignoring an error is truly
  correct (e.g. AbortError), match that specific error and comment why.

tags:
  - typescript
  - reliability
  - error-handling

triggers:
  file_patterns:
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.mts"
    - "**/*.cts"
    - "**/*.js"
    - "**/*.jsx"
  code_patterns:
    - '\bcatch\b'
    - '\.catch\('

examples:
  bad: |
    try {
      await saveData();
    } catch (e) {
      console.log(e);
    }
  good: |
    try {
      await saveData();
    } catch (e) {
      logger.error('Failed to save data', { error: e, context });
      throw new SaveError('Data save failed', { cause: e });
    }
