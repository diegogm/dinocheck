id: typescript/async-constructor
name: Async operations in constructor
level: major
category: async
description: |
  Detects async work started inside a constructor. Constructors cannot be
  async and cannot await, so fire-and-forget calls (.then, fetch) leave the
  object partially initialized: consumers receive an instance whose fields
  may not exist yet, and initialization errors escape as unhandled rejections
  with no way for the caller to catch them.
checklist:
  - Does the constructor start async operations (fetch, .then(), a called async method) without any way to await them?
  - Are object properties assigned inside async callbacks after construction returns?
  - Can callers use the instance before the async initialization finishes?
  - Where do errors from the async initialization go — can the caller handle them?
  - Would a static async factory (or an explicit init() the caller must await) make readiness explicit?
fix: |
  Move async initialization out of the constructor. Use a static async
  factory: make the constructor private and synchronous, and expose
  `static async create(): Promise<T>` that awaits the async work and passes
  the results to the constructor. Callers then `await T.create()` and always
  receive a fully initialized instance.

tags:
  - typescript
  - async
  - patterns

triggers:
  file_patterns:
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.mts"
    - "**/*.cts"
  code_patterns:
    - 'constructor\s*\([^)]*\)\s*\{[\s\S]{0,300}?(\bawait\b|\.then\(|fetch\(|axios\.)'
    - 'async\s+constructor'

examples:
  bad: |
    class UserService {
      constructor() {
        this.loadConfig().then(c => this.config = c);
      }
    }
  good: |
    class UserService {
      private constructor(private config: Config) {}

      static async create(): Promise<UserService> {
        const config = await loadConfig();
        return new UserService(config);
      }
    }
