id: typescript/floating-promise
name: Unhandled floating promise
level: major
category: async
description: |
  Detects promises that are neither awaited, returned, nor given a .catch
  handler. A floating promise swallows its errors as unhandled rejections and
  breaks intended ordering: code after the call runs before the async work
  finishes, causing races like navigating away before a save completes.
checklist:
  - Is an async or promise-returning function called without await, .then/.catch, or returning the promise?
  - Does subsequent code assume the async operation already completed (navigation, state updates, cleanup)?
  - If the promise rejects, is the error handled anywhere or does it become an unhandled rejection?
  - For intentional fire-and-forget, is it marked explicitly (void operator) and given a .catch?
  - Are promises created in loops or Array.map left uncollected instead of gathered with Promise.all?
fix: |
  Await the promise (making the caller async if needed) or return it to the
  caller. For deliberate fire-and-forget, be explicit and still handle
  failure: `void doAsync().catch(reportError); // fire-and-forget: <why>`.
  For parallel work, collect promises and `await Promise.all(...)`. Enable
  @typescript-eslint/no-floating-promises to catch these automatically.

tags:
  - typescript
  - async
  - error-handling

triggers:
  file_patterns:
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.mts"
    - "**/*.cts"
    - "**/*.js"
    - "**/*.jsx"
  code_patterns:
    - '\basync\s'
    - '\bawait\s'
    - '\.then\('
    - 'Promise\.(all|allSettled|race|resolve|reject)'

examples:
  bad: |
    async function handleSubmit() {
      saveData(formData); // Floating promise: not awaited, errors lost
      navigate('/success'); // Runs before the save finishes
    }
  good: |
    async function handleSubmit() {
      await saveData(formData);
      navigate('/success');
    }
