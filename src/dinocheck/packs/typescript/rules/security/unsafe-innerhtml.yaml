id: typescript/unsafe-innerhtml
name: Unsafe innerHTML usage
level: critical
category: security
description: |
  Detects HTML injected into the DOM from dynamic strings: innerHTML /
  outerHTML assignments, insertAdjacentHTML, and React's
  dangerouslySetInnerHTML. If any part of the string is user-controlled, the
  attacker's markup and script handlers execute in other users' browsers
  (XSS), enabling session theft and account takeover.
checklist:
  - Is innerHTML/outerHTML assigned or insertAdjacentHTML called with a non-constant string?
  - Does the string interpolate user input, API data, or URL parameters (template literals are the usual path)?
  - Is the content sanitized with DOMPurify (or equivalent) immediately before insertion?
  - Would textContent suffice because the content is plain text, not markup?
  - In React code, is dangerouslySetInnerHTML fed unsanitized data?
fix: |
  Use textContent (or DOM APIs like createElement/append) for plain text —
  it cannot execute. When real HTML must be rendered, sanitize at the point
  of insertion: element.innerHTML = DOMPurify.sanitize(html). In React,
  prefer JSX rendering; if dangerouslySetInnerHTML is unavoidable, pass only
  sanitized content.

tags:
  - typescript
  - security
  - xss

triggers:
  file_patterns:
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.mts"
    - "**/*.cts"
    - "**/*.js"
    - "**/*.jsx"
  code_patterns:
    - '\.(innerHTML|outerHTML)\s*='
    - 'dangerouslySetInnerHTML'
    - 'insertAdjacentHTML\('

examples:
  bad: |
    element.innerHTML = `<div>${userComment}</div>`;
    <div dangerouslySetInnerHTML={{ __html: comment }} />
  good: |
    element.textContent = userComment;
    <div dangerouslySetInnerHTML={{ __html: DOMPurify.sanitize(comment) }} />
