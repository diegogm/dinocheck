id: typescript/eval-usage
name: Dangerous eval or Function constructor
level: critical
category: security
description: |
  Detects eval(), new Function(), and string arguments to setTimeout /
  setInterval. These execute arbitrary strings as code, so any user-influenced
  input becomes remote code execution in the user's session. They also defeat
  CSP, minification, and static analysis.
checklist:
  - Is eval() called with anything other than a hardcoded constant?
  - Is new Function() built from dynamic or user-controlled strings?
  - Are setTimeout/setInterval passed a string instead of a function?
  - Is code execution being used where a data structure would do (parsing JSON, dispatching by name)?
  - Could any part of the evaluated string be influenced by user input, config, or API responses?
fix: |
  Replace eval-based patterns with data: JSON.parse() for serialized data, an
  object map or switch for dispatch-by-name (actions[name]?.(args)), and a
  real template engine for templating. Pass functions, not strings, to
  setTimeout/setInterval. If dynamic code loading is genuinely required, use
  dynamic import() of vetted modules.

tags:
  - typescript
  - security
  - code-injection

triggers:
  file_patterns:
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.mts"
    - "**/*.cts"
    - "**/*.js"
    - "**/*.jsx"
  code_patterns:
    - '\beval\('
    - 'new Function\('
    - 'setTimeout\([''"]'
    - 'setInterval\([''"]'

examples:
  bad: |
    eval(`process_${action}(data)`);
    const fn = new Function('x', userCode);
    setTimeout("doAction()", 1000);
  good: |
    const actions = { save: processSave, delete: processDelete };
    actions[action]?.(data);
    setTimeout(() => doAction(), 1000);
