id: typescript/any-abuse
name: Excessive use of any type
level: major
category: types
description: |
  Detects 'any' used in annotations, casts, and generics. 'any' switches off
  type checking for the value and everything derived from it, so typos and
  wrong shapes that the compiler would catch become runtime errors. It also
  spreads: one 'any' silently infects every expression it touches and breaks
  autocomplete and safe refactoring.
checklist:
  - Are parameters, return types, or variables annotated as any where a concrete type or generic is knowable?
  - Is 'as any' used to silence a real type error instead of fixing the underlying type?
  - Is external/untyped data (JSON, API responses) typed as any instead of unknown plus validation?
  - Would 'unknown' (which forces narrowing before use) express the intent more safely?
  - Are missing third-party types the cause, and could a .d.ts declaration or @types package fix it?
fix: |
  Replace any with the most specific type available: a concrete
  interface/type, a generic parameter, or 'unknown' for data whose shape is
  established later via type guards or a schema validator (e.g. Zod). For
  untyped libraries, add a declaration file rather than casting call sites.
  Enable "noImplicitAny" so new gaps surface at compile time.

tags:
  - typescript
  - types
  - safety

triggers:
  file_patterns:
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.mts"
    - "**/*.cts"
  code_patterns:
    - ':\s*any\b'
    - '\bas any\b'
    - '<any[>,\s]'
    - '\bany\[\]'

examples:
  bad: |
    function process(data: any): any {
      return data.map((x: any) => x.value);
    }
  good: |
    interface Item { value: string; }
    function process(data: Item[]): string[] {
      return data.map(x => x.value);
    }
