id: typescript/type-assertion-abuse
name: Unsafe type assertion
level: major
category: types
description: |
  Detects type assertions (as Type, as unknown as Type) that override the
  compiler without a runtime guarantee. Asserting a shape onto parsed JSON or
  DOM values does not make it true — the mismatch surfaces later as undefined
  fields and TypeErrors far from the cause. 'as unknown as' double assertions
  can force any type onto any value.
checklist:
  - Is JSON.parse or an API/fetch response cast directly to a type without runtime validation?
  - Is 'as unknown as' used to bridge incompatible types?
  - Is the assertion masking a type error that a corrected type or generic would fix properly?
  - Would a type guard (instanceof, in, discriminant check) or a schema validator replace the assertion?
  - Is the assertion at least plausible (narrowing a union, DOM element type) and documented, versus arbitrary?
fix: |
  Validate instead of asserting: parse external data with a schema library
  (Zod, valibot) — `UserSchema.parse(json)` — or write a type guard function
  and narrow with it. For DOM/event values use instanceof narrowing. Prefer
  'satisfies' to check literals without widening. Legitimate assertions
  ('as const', narrowing after a check you just made) are fine.

tags:
  - typescript
  - types
  - safety

triggers:
  file_patterns:
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.mts"
    - "**/*.cts"
  code_patterns:
    - '\bas unknown as\b'
    - '\)\s*as\s+[A-Z]'
    - '\w\s+as\s+[A-Z]\w*'

examples:
  bad: |
    const data = JSON.parse(response) as UserData;
    const element = event.target as unknown as HTMLInputElement;
  good: |
    const data = UserDataSchema.parse(JSON.parse(response));
    if (event.target instanceof HTMLInputElement) {
      const element = event.target;
    }
