id: typescript/non-null-assertion
name: Unsafe non-null assertion
level: major
category: types
description: |
  Detects the non-null assertion operator (!) used to silence nullability
  errors without an actual guarantee. The operator performs no runtime check:
  if the value is null or undefined, the code throws (or propagates undefined)
  exactly where the compiler tried to warn. Common on .find(), .get(), DOM
  lookups, and optional properties.
checklist:
  - Is ! applied to a value that can genuinely be null/undefined at runtime (find, get, querySelector, optional props)?
  - Are assertions chained (obj!.prop!.value), compounding unchecked assumptions?
  - Is the assertion just silencing the compiler where a null check, ?., or ?? belongs?
  - When the value is unexpectedly absent, would an explicit error message beat a raw TypeError?
  - Is there an invariant that truly guarantees presence, and is it documented at the assertion site?
fix: |
  Handle absence explicitly: use optional chaining (?.) with nullish
  coalescing (??) for soft fallbacks, or an early guard that throws a
  descriptive error (`if (!user) throw new Error(...)`) so the compiler
  narrows the type. Reserve ! for cases with a provable invariant (e.g.
  checked immediately above, definite assignment) and keep it adjacent to
  the proof.

tags:
  - typescript
  - types
  - null-safety

triggers:
  file_patterns:
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.mts"
    - "**/*.cts"
  code_patterns:
    - '!\.'
    - '!\['
    - '!;'
    - '\)!(?!=)'

examples:
  bad: |
    const user = users.find(u => u.id === id)!;
    console.log(user.name);
  good: |
    const user = users.find(u => u.id === id);
    if (!user) throw new Error(`User ${id} not found`);
    console.log(user.name);
    // Or: console.log(user?.name ?? 'Unknown');
