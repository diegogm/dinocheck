id: docker-compose/privileged-mode
name: Container running in privileged mode
level: critical
category: security
description: |
  Detects services with privileged: true or sweeping capability grants.
  Privileged mode disables essentially all container isolation: the
  container sees host devices, can modify kernel parameters, and can
  trivially escape to the host. cap_add: SYS_ADMIN or ALL is nearly as
  dangerous. A compromised privileged container equals a compromised host.
checklist:
  - "Does any service set privileged: true?"
  - Does any service use cap_add with ALL or SYS_ADMIN?
  - "Are dangerous device or apparmor/seccomp overrides used (devices: /dev, security_opt with seccomp:unconfined)?"
  - Was privileged mode added just to make something work, when a single capability, a device mapping, or a volume would suffice?
  - Is the workload one of the rare legitimate cases (Docker-in-Docker, low-level system agents), and is that isolated and documented?
fix: |
  Remove privileged: true. Start from least privilege and add back only what
  the workload needs:
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
  Map specific devices with devices: instead of exposing everything. Most
  application containers need no extra capabilities at all. If Docker access
  is needed, prefer a socket proxy over privileged Docker-in-Docker.

tags:
  - docker-compose
  - security
  - container

triggers:
  file_patterns:
    - "**/docker-compose*.yml"
    - "**/docker-compose*.yaml"
    - "**/compose*.yml"
    - "**/compose*.yaml"
  code_patterns:
    - "privileged:\\s*[Tt]rue"
    - "\\bcap_add:"
    - "\\bSYS_ADMIN\\b"
    - "seccomp[:=]unconfined"

examples:
  bad: |
    services:
      app:
        image: myapp
        privileged: true
      agent:
        image: myagent
        cap_add:
          - ALL
  good: |
    services:
      app:
        image: myapp
        cap_drop:
          - ALL
        cap_add:
          - NET_BIND_SERVICE
