id: docker-compose/read-only-filesystem
name: Writable root filesystem
level: minor
category: security
description: |
  Detects services that keep the default writable root filesystem. If the
  container is compromised, a writable rootfs lets the attacker drop tools,
  patch binaries, and persist across the container's lifetime. Setting
  read_only: true confines writes to explicitly declared volumes and tmpfs
  mounts, sharply limiting what an intruder can change.
checklist:
  - "Do production-facing services lack read_only: true?"
  - "Which paths does the application actually write (tmp dirs, cache, pid files, uploads), and are they covered by tmpfs: or named volumes?"
  - Would the service still run with a read-only root (has this been tested), or does the image write to arbitrary locations at startup?
  - Is write access granted narrowly (specific mounts) rather than by leaving the whole filesystem writable?
fix: |
  Enable a read-only root and mount only the paths that need writes:
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    volumes:
      - app-data:/app/data
  Roll it out per service and test startup: error messages quickly reveal
  any missing writable path. Combine with cap_drop and a non-root user for
  defense in depth.

tags:
  - docker-compose
  - security
  - filesystem

triggers:
  file_patterns:
    - "**/docker-compose*.yml"
    - "**/docker-compose*.yaml"
    - "**/compose*.yml"
    - "**/compose*.yaml"
  code_patterns:
    - "\\bservices:"

examples:
  bad: |
    services:
      app:
        image: myapp
        # Root filesystem writable by default: attackers can drop tools and persist
  good: |
    services:
      app:
        image: myapp
        read_only: true
        tmpfs:
          - /tmp
          - /var/run
        volumes:
          - app-data:/app/data
    volumes:
      app-data:
