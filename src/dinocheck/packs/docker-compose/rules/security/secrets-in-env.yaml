id: docker-compose/secrets-in-env
name: Secrets exposed in environment
level: critical
category: security
description: |
  Detects credentials hardcoded in compose files (environment:, or committed
  env_file targets). Compose files live in version control, so a literal
  password there is leaked to everyone with repo access - forever, via git
  history. Values in environment: are also visible to anyone who can run
  docker inspect on the container.
checklist:
  - "Does environment: contain literal sensitive values (passwords, API keys, tokens) instead of ${VAR} references or *_FILE indirection?"
  - "Do env_file: entries point to files that are committed to version control with real secrets inside?"
  - Are secrets interpolated with insecure defaults, e.g. ${DB_PASSWORD:-supersecret}?
  - "Would Docker secrets (secrets: + *_FILE variables) work here instead of environment variables?"
  - If a real secret is already in the file or git history, has it been rotated?
fix: |
  Never commit literal secrets. Options, strongest first:
  1. Docker secrets: mount via secrets: and point the app at the file
     (POSTGRES_PASSWORD_FILE: /run/secrets/db_password).
  2. Host interpolation: POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} with the
     value supplied by the deploy environment or an uncommitted .env
     (gitignored, without insecure :-defaults).
  Rotate any credential that has ever been committed.

tags:
  - docker-compose
  - security
  - secrets

triggers:
  file_patterns:
    - "**/docker-compose*.yml"
    - "**/docker-compose*.yaml"
    - "**/compose*.yml"
    - "**/compose*.yaml"
  code_patterns:
    - "(?i)\\w*(password|passwd|secret|token|api_?key|private_key)\\w*\\s*[:=]"
    - "\\benv_file:"

examples:
  bad: |
    services:
      db:
        image: postgres:16.1
        environment:
          POSTGRES_PASSWORD: supersecret123   # literal secret in git
          API_KEY: abc123xyz
  good: |
    services:
      db:
        image: postgres:16.1
        environment:
          POSTGRES_PASSWORD_FILE: /run/secrets/db_password
        secrets:
          - db_password
    secrets:
      db_password:
        external: true
