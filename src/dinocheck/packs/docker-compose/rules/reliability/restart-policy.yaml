id: docker-compose/missing-restart-policy
name: Missing or incorrect restart policy
level: minor
category: reliability
description: |
  Detects services without a restart policy or with a policy that masks
  failures. The default ("no") means a crashed container stays down after a
  crash or host reboot, causing silent outages. At the other extreme,
  restart: always blindly loops forever on a service that can never start
  (bad config, missing migration), hiding the root cause behind constant
  restarts.
checklist:
  - Do long-running services meant to survive crashes/reboots lack a restart policy entirely?
  - "Is restart: always used where unless-stopped would be more appropriate (always resurrects containers you stopped manually, after a daemon restart)?"
  - "For services with known-fragile startup, would restart: on-failure with a retry cap surface config errors faster than infinite retries?"
  - "Are one-shot containers (migrations, seed jobs) correctly left with the default restart policy 'no' so they do not re-run in a loop?"
fix: |
  Use restart: unless-stopped for typical long-running services - it
  restarts on crash and reboot but respects manual stops. Use
  restart: on-failure:5 for services where repeated failure should become
  visible instead of looping forever. Keep restart: "no" (default) for
  one-shot jobs. Under Swarm, configure deploy.restart_policy instead.

tags:
  - docker-compose
  - reliability
  - availability

triggers:
  file_patterns:
    - "**/docker-compose*.yml"
    - "**/docker-compose*.yaml"
    - "**/compose*.yml"
    - "**/compose*.yaml"
  code_patterns:
    - "\\bservices:"

examples:
  bad: |
    services:
      app:
        image: myapp
        # No restart policy: stays down after a crash or host reboot
      worker:
        image: myworker
        restart: always   # loops forever even on unfixable config errors
  good: |
    services:
      app:
        image: myapp
        restart: unless-stopped
      worker:
        image: myworker
        restart: on-failure:5
