id: docker-compose/missing-resource-limits
name: Missing resource limits
level: minor
category: reliability
description: |
  Detects services deployed without memory or CPU limits. An unbounded
  container with a memory leak or a CPU-hungry task can starve every other
  service on the host and trigger the kernel OOM killer against arbitrary
  processes. Limits turn "one bad service takes down the host" into "one
  bad service gets throttled or restarted".
checklist:
  - Do services intended for production lack a memory limit (deploy.resources.limits.memory or mem_limit)?
  - Do CPU-intensive services lack a CPU limit (deploy.resources.limits.cpus or cpus)?
  - Are reservations set for critical services so they keep minimum resources under contention?
  - Are the limits plausible for the workload (JVM/node heap fits inside the memory limit), so the limit itself does not cause OOM kills?
fix: |
  Set limits per service, based on observed usage (docker stats):
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
  With plain docker compose (no Swarm), deploy.resources.limits is honored
  by recent Compose versions; mem_limit/cpus work as legacy alternatives.
  Purely local development files may reasonably skip limits.

tags:
  - docker-compose
  - reliability
  - resources

triggers:
  file_patterns:
    - "**/docker-compose*.yml"
    - "**/docker-compose*.yaml"
    - "**/compose*.yml"
    - "**/compose*.yaml"
  code_patterns:
    - "\\bservices:"

examples:
  bad: |
    services:
      app:
        image: myapp
        # No limits: a leak here can OOM the whole host
  good: |
    services:
      app:
        image: myapp
        deploy:
          resources:
            limits:
              cpus: '0.5'
              memory: 512M
            reservations:
              cpus: '0.25'
              memory: 256M
