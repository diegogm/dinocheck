id: docker-compose/missing-healthcheck
name: Missing health check configuration
level: minor
category: reliability
description: |
  Detects long-running services without a healthcheck and depends_on
  declarations that only wait for container start, not readiness. Without
  health checks a container may be "running" while the app inside is
  deadlocked or still booting, and dependent services will start too early
  and crash on connection errors (the classic "web starts before the DB is
  ready" failure).
checklist:
  - Do long-running services (web apps, databases, queues) lack a healthcheck, either in the compose file or inherited from their image?
  - Is depends_on used in short list form instead of with condition service_healthy for dependencies that must be ready?
  - Does the healthcheck test real readiness (pg_isready, an HTTP /health endpoint) rather than mere process existence?
  - Are interval, timeout, retries and start_period appropriate for how long the service takes to boot?
fix: |
  Add a healthcheck to each long-running service and gate dependents on it:
    db:
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 10s
        timeout: 5s
        retries: 5
    web:
      depends_on:
        db:
          condition: service_healthy
  For HTTP services use curl/wget against a health endpoint; make sure the
  binary exists in the image.

tags:
  - docker-compose
  - reliability
  - observability

triggers:
  file_patterns:
    - "**/docker-compose*.yml"
    - "**/docker-compose*.yaml"
    - "**/compose*.yml"
    - "**/compose*.yaml"
  code_patterns:
    - "\\bdepends_on:"
    - "\\bports:"
    - "\\bexpose:"

examples:
  bad: |
    services:
      web:
        image: myapp
        ports:
          - "127.0.0.1:8000:8000"
        depends_on:
          - db     # waits only for container start, not readiness
      db:
        image: postgres:16.1
  good: |
    services:
      web:
        image: myapp
        ports:
          - "127.0.0.1:8000:8000"
        depends_on:
          db:
            condition: service_healthy
      db:
        image: postgres:16.1
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U postgres"]
          interval: 10s
          timeout: 5s
          retries: 5
