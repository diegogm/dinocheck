id: latex/citation-bibliography-consistency
name: Citation and bibliography consistency
level: major
category: citations
description: |
  Detects citation keys that likely have no matching bibliography entry, and
  documents that cite works without any bibliography setup. Unresolved keys
  compile to bold "[?]" markers in the PDF, which readers and reviewers
  immediately notice, and inconsistent key styles are a common source of
  silent mismatches after renaming entries.

checklist:
  - Do any \cite/\citep/\citet keys look absent from the referenced .bib files or thebibliography entries?
  - Is a bibliography mechanism configured at all (\bibliography{...}, \addbibresource{...} plus \printbibliography, or a thebibliography environment) when citations exist?
  - Are key styles mixed (smith2021transformer vs smith2021-transformer vs Smith21), suggesting typos or renamed entries?
  - Are natbib commands (\citep, \citet) or biblatex commands used without loading the corresponding package?
  - Are works cited via hardcoded text (e.g. "(Smith et al., 2021)") instead of citation commands?
fix: |
  Make every citation key resolve: cross-check keys against the .bib file,
  fix typos, and standardize one key naming scheme. Ensure the bibliography
  pipeline is complete for the chosen workflow - BibTeX
  (\bibliographystyle + \bibliography) or biblatex/Biber
  (\usepackage[backend=biber]{biblatex}, \addbibresource, \printbibliography).
  Replace hand-written citations with \cite-family commands.

tags:
  - latex
  - citations
  - references

triggers:
  file_patterns:
    - "**/*.tex"
  code_patterns:
    - '\\cite[a-z]*\{'
    - '\\bibliography\{'
    - '\\addbibresource\{'
    - '\\printbibliography'
    - '\\begin\{thebibliography\}'

examples:
  bad: |
    Prior work \cite{smith2021-transformer} reports strong results.
    % No \bibliography / \addbibresource anywhere: renders as [?]
  good: |
    Prior work \cite{smith2021transformer} reports strong results.
    % In the preamble: \addbibresource{references.bib}
    % At the end:     \printbibliography
