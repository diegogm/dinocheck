id: latex/math-mode-clarity
name: Unclear or inconsistent math mode usage
level: major
category: math
description: |
  Detects mathematical content written as plain text (variables, formulas,
  sub/superscripts outside math mode) and inconsistent math delimiters.
  Prose formulas like "L = 1/n sum_i ..." render with wrong fonts and
  spacing or fail to compile (a bare _ outside math mode is an error), and
  mixing $...$, \(...\) and \[...\] across a document makes the source
  harder to maintain.

checklist:
  - Are variables, operators, or formulas written in plain prose instead of being wrapped in math mode?
  - Do sub/superscripts (x_i, x^2) or pseudo-notation (sum_i, 1/n) appear outside math delimiters?
  - Are inline delimiters mixed inconsistently ($...$ in some places, \(...\) in others) without reason?
  - Is display math faked with $$...$$ or inline math where \[...\] or equation/align environments belong?
  - Are words inside equations wrapped in \text{...}/\mathrm{...} rather than typeset as implied variable products?
fix: |
  Wrap all mathematical content in math mode: $L = \frac{1}{n}\sum_i (y_i -
  \hat{y}_i)^2$ inline, and \[...\] or equation/align environments for
  display math (avoid plain-TeX $$...$$). Pick one inline delimiter style
  for the whole document. Use \text{...} for words inside formulas, and
  proper commands (\frac, \sum, \cdot) instead of ASCII approximations.

tags:
  - latex
  - math
  - readability

triggers:
  file_patterns:
    - "**/*.tex"
  code_patterns:
    - '[A-Za-z0-9)\}]\s*=\s*[A-Za-z0-9(\\{]'
    - '\\frac'
    - '\\sum'
    - '\\int'
    - '\$\$'

examples:
  bad: |
    The loss is L = 1/n sum_i (y_i - \hat{y}_i)^2.
  good: |
    The loss is $L = \frac{1}{n}\sum_i (y_i - \hat{y}_i)^2$.
