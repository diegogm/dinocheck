id: sh/unchecked-commands
name: Critical commands without error checking
level: major
category: reliability
description: |
  Detects critical commands (cd, rm, mkdir, cp, mv) whose failure is
  ignored. The classic disaster is an unchecked cd followed by rm -rf: if cd
  fails, the rm runs in the wrong directory and deletes the wrong files.
  Without exit-status checks the script continues in an inconsistent state,
  turning a small failure into data loss or a corrupted result.
checklist:
  - Is any cd followed by destructive or state-changing commands without || exit (and without set -e in effect)?
  - Does rm -rf operate on a path built from variables that could be empty or wrong, with no prior validation?
  - Is mkdir used without -p where the directory may already exist, causing spurious failures?
  - Do critical copies/moves (cp, mv, tar, rsync) run unchecked in ways that let later steps proceed with missing files?
  - Are failures that are genuinely acceptable made explicit with || true rather than silently ignored?
fix: |
  Make failure handling explicit for every command whose failure changes the
  outcome: cd /path || exit 1 (or die "msg"), mkdir -p for idempotent
  creation, and validate variables before destructive use:
    [ -n "$BUILD_DIR" ] && rm -rf "${BUILD_DIR:?}/dist"
  Combine with set -e as a safety net (not a substitute) and use
  trap '...' EXIT for cleanup on failure paths.

tags:
  - shell
  - reliability
  - error-handling

triggers:
  file_patterns:
    - "**/*.sh"
    - "**/*.bash"
  code_patterns:
    - "(^|\\n|;|&&\\s*)cd\\s"
    - "\\brm\\s+-[a-z]*[rf]"
    - "\\bmkdir\\s"

examples:
  bad: |
    cd "$BUILD_DIR"
    rm -rf dist/
    mkdir output
  good: |
    cd "$BUILD_DIR" || exit 1
    rm -rf dist/
    mkdir -p output
