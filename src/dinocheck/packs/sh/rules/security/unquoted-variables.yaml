id: sh/unquoted-variables
name: Unquoted variable expansion
level: major
category: security
description: |
  Detects variable expansions used without double quotes. Unquoted values
  undergo word splitting and glob expansion, so a path with a space becomes
  two arguments and a value containing * expands to file names. With
  destructive commands this is dangerous: rm -rf $DIR with DIR="/tmp/build "
  (trailing space) or an empty variable deletes the wrong things entirely.
checklist:
  - Are variables passed unquoted to destructive or filesystem commands (rm, cp, mv, chmod, chown, cd)?
  - Are paths or user-controlled values expanded unquoted anywhere they could contain spaces, globs, or leading dashes?
  - Do for loops iterate over unquoted expansions (for f in $FILES) instead of arrays or globs?
  - Is command substitution used unquoted, e.g. cd $(dirname $0) instead of cd "$(dirname "$0")"?
  - "Where splitting is actually intended, is that made explicit (array, read -ra, documented shellcheck disable comment)?"
fix: |
  Double-quote every expansion by default: "$var", "${arr[@]}",
  "$(command)". Only omit quotes when word splitting is the deliberate goal,
  and prefer arrays for that in bash. shellcheck flags these automatically
  (SC2086); run it in CI.

tags:
  - shell
  - security
  - reliability

triggers:
  file_patterns:
    - "**/*.sh"
    - "**/*.bash"
    - "**/.*rc"
  code_patterns:
    - "\\b(rm|cp|mv|chmod|chown|cd|ln)\\s+(-[\\w-]+\\s+)*\\$"
    - "\\b(echo|cat|touch|mkdir)\\s+[^\"'\\n]*\\$[A-Za-z_{]"
    - "\\bfor\\s+\\w+\\s+in\\s+\\$"

examples:
  bad: |
    rm -rf $DIRECTORY
    cd $PROJECT_PATH
    for f in $FILES; do
      echo $f
    done
  good: |
    rm -rf "$DIRECTORY"
    cd "$PROJECT_PATH"
    for f in "${FILES_ARRAY[@]}"; do
      echo "$f"
    done
