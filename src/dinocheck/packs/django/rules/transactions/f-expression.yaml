id: django/f-expression
name: Use F() for Atomic Field Updates
level: major
category: transactions
description: |
  Detects read-modify-write updates of model fields in Python
  (obj.field -= x; obj.save()). Under concurrency two requests read the
  same value and one update is silently lost. F() expressions push the
  arithmetic into SQL, making the update atomic.

triggers:
  file_patterns:
    - "**/*.py"
  code_patterns:
    - "\\.\\w+\\s*[-+]=\\s*\\w"
    - "\\.(\\w+)\\s*=\\s*\\w+\\.\\1\\s*[-+]"

checklist:
  - Is a model field read, modified in Python, and saved back (obj.field -= x; obj.save())?
  - Could two concurrent requests run this read-modify-write and lose one update?
  - Would F('field') + value express the same update atomically in SQL?
  - If the new value is needed afterwards, is refresh_from_db() called after the update?

fix: Use Model.objects.filter(pk=obj.pk).update(field=F('field') + value).

tags:
  - transactions
  - race-condition

examples:
  bad: |
    product.stock -= quantity
    product.save()
  good: |
    Product.objects.filter(pk=product.pk).update(stock=F('stock') - quantity)
