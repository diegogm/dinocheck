id: django/on-commit-side-effects
name: Side Effects Should Use on_commit
level: major
category: transactions
description: |
  Side effects like sending emails inside atomic blocks may execute
  even if the transaction rolls back.

triggers:
  file_patterns:
    - "**/*.py"
  code_patterns:
    - "transaction\\.atomic[\\s\\S]*(send_|\\.delay\\(|\\.apply_async\\()"
    - "@atomic[\\s\\S]*(send_|\\.delay\\()"

checklist:
  - Email/notification sent inside atomic block
  - Celery task triggered inside atomic block

fix: |
  Use transaction.on_commit() for side effects that should only
  run after the transaction commits successfully.

tags:
  - transactions
  - side-effects

examples:
  bad: |
    with transaction.atomic():
        order.save()
        OrderLine.objects.bulk_create(lines)
        send_confirmation_email(order)  # sent even if the transaction rolls back
        notify_warehouse.delay(order.pk)  # task may run before commit is visible
  good: |
    with transaction.atomic():
        order.save()
        OrderLine.objects.bulk_create(lines)
        transaction.on_commit(lambda: send_confirmation_email(order))
        transaction.on_commit(lambda: notify_warehouse.delay(order.pk))
