id: django/select-for-update
name: Missing select_for_update in Race Condition
level: critical
category: transactions
description: |
  Operations that check and update data need select_for_update()
  to prevent race conditions.

triggers:
  file_patterns:
    - "**/*.py"
  code_patterns:
    - "if\\s+not\\s+\\w+\\.\\w+:"
    - "if\\s+\\w+\\.\\w+\\s*=="

checklist:
  - Check-then-update pattern without locking
  - Missing select_for_update in atomic block

fix: Use select_for_update() within a transaction.atomic() block.

tags:
  - transactions
  - race-condition
  - concurrency

examples:
  bad: |
    product = Product.objects.get(pk=pk)
    if product.stock == 0:
        raise OutOfStock()
    product.stock -= 1  # another request may have taken the last unit
    product.save()
  good: |
    with transaction.atomic():
        product = Product.objects.select_for_update().get(pk=pk)
        if product.stock == 0:
            raise OutOfStock()
        product.stock = F("stock") - 1
        product.save()
