id: django/permission-logic-mismatch
name: Permission vs Business Logic Mismatch
level: critical
category: security
description: |
  Detects gaps between declared permissions and what the code actually allows:
  views whose permission_classes only check authentication while handlers
  perform owner-sensitive operations, service functions reachable from multiple
  entry points but authorized in only one, or checks present in one layer and
  silently absent in another.

triggers:
  file_patterns:
    - "**/*.py"
  code_patterns:
    - "permission_classes"
    - "has_object_permission"
    - "IsAuthenticated"
    - "request\\.user"

checklist:
  - Does the view mutate or delete objects that belong to a user while its permission_classes only verify authentication?
  - If object permissions exist, are they actually evaluated - is self.get_object() (which runs check_object_permissions) used, instead of a manual Model.objects.get()?
  - Can the same business function be reached from another endpoint, task, or admin action that skips the permission check done here?
  - Do in-view conditions on request.user match what the permission classes claim (no branch quietly widening access)?
  - Are checks consistent across list/detail/custom actions, or does one action leak what the others protect?

fix: |
  Enforce authorization where the data is accessed: object-level permission
  classes plus get_queryset() scoped to request.user. Fetch objects via
  self.get_object() so has_object_permission runs. If business logic is shared
  across entry points, move the authorization into the service layer and pass
  the acting user explicitly.

tags:
  - security
  - authorization
  - architecture

examples:
  bad: |
    class ArticleViewSet(ModelViewSet):
        permission_classes = [IsAuthenticated]

        def destroy(self, request, pk):
            article = Article.objects.get(pk=pk)
            article.delete()  # Any logged-in user can delete any article!
  good: |
    class ArticleViewSet(ModelViewSet):
        permission_classes = [IsAuthenticated, IsOwnerOrAdmin]

        def destroy(self, request, pk):
            article = self.get_object()  # runs has_object_permission
            article.delete()
