id: django/api-rate-limiting
name: API Rate Limiting Review
level: major
category: reliability
description: |
  Reviews DRF endpoints for missing or inadequate rate limiting. Endpoints that
  are expensive (reports, exports, search), abusable (login, password reset,
  OTP), or anonymous need throttling; without it a single client can exhaust
  workers and database capacity or brute-force credentials.

triggers:
  file_patterns:
    - "**/*.py"
  code_patterns:
    - "ViewSet\\b"
    - "APIView\\b"
    - "@api_view"
    - "throttle_classes"

checklist:
  - Do publicly reachable or anonymous endpoints have throttle_classes, or is there a DEFAULT_THROTTLE_CLASSES/RATES fallback in settings?
  - Are authentication-adjacent endpoints (login, signup, password reset, OTP) throttled tightly enough to block brute force?
  - Do expensive operations (report generation, exports, bulk writes, search) have stricter limits than cheap reads, e.g. via throttle_scope?
  - Are anonymous and authenticated clients given different rates (AnonRateThrottle vs UserRateThrottle)?
  - If throttling is deliberately absent (internal service, gateway-level limits), is that protection actually in place?

fix: |
  Set DEFAULT_THROTTLE_CLASSES and DEFAULT_THROTTLE_RATES in REST_FRAMEWORK
  settings as a baseline, then add ScopedRateThrottle with a tight
  throttle_scope on expensive or sensitive views. Rate-limit by user for
  authenticated traffic and by IP for anonymous traffic.

tags:
  - reliability
  - drf
  - rate-limiting
  - dos-prevention

examples:
  bad: |
    class ReportViewSet(ModelViewSet):
        # No throttling on expensive report generation
        queryset = Report.objects.all()
  good: |
    class ReportViewSet(ModelViewSet):
        queryset = Report.objects.all()
        throttle_classes = [ScopedRateThrottle]
        throttle_scope = 'reports'  # e.g. '10/hour' in DEFAULT_THROTTLE_RATES
