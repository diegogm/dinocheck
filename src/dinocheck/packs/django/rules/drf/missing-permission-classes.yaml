id: django/api-authorization
name: API Authorization Review
level: critical
category: security
description: |
  Reviews DRF views and viewsets for missing or insufficient authorization.
  A view without permission_classes silently inherits project defaults (often
  AllowAny), and IsAuthenticated alone still lets any logged-in user read or
  modify other users' objects when object-level checks and queryset scoping are
  missing.

triggers:
  file_patterns:
    - "**/*.py"
  code_patterns:
    - "ViewSet\\b"
    - "APIView\\b"
    - "@api_view"
    - "permission_classes"

checklist:
  - Does every view declare permission_classes explicitly, or is it knowingly relying on a safe project-wide default?
  - Do the permissions match the operation's sensitivity - are write/delete actions more restricted than reads?
  - For per-user resources, is there object-level enforcement (has_object_permission or get_queryset filtered by request.user), not just IsAuthenticated?
  - Can a user reach other users' objects by guessing IDs because queryset is Model.objects.all() without ownership filtering?
  - Do custom actions (@action) and overridden methods keep the same permission checks as the standard ones?

fix: |
  Declare explicit permission_classes on every view; set a restrictive
  DEFAULT_PERMISSION_CLASSES (e.g. IsAuthenticated) so omissions fail closed.
  For ownership, combine an object-level permission class with get_queryset()
  filtered by request.user - filtering alone protects list/detail, the
  permission class protects custom actions.

tags:
  - security
  - drf
  - authorization

examples:
  bad: |
    class UserViewSet(ModelViewSet):
        queryset = User.objects.all()  # No permissions, inherits global default
  good: |
    class UserViewSet(ModelViewSet):
        permission_classes = [IsAuthenticated, IsOwnerOrAdmin]

        def get_queryset(self):
            if self.request.user.is_staff:
                return User.objects.all()
            return User.objects.filter(pk=self.request.user.pk)
