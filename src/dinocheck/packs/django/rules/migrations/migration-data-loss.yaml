id: django/migration-data-loss
name: Migration Data Loss Risk
level: blocker
category: migrations
description: |
  Detects migrations that can destroy or corrupt production data: RemoveField
  and DeleteModel drop columns/tables and their contents immediately, AlterField
  type changes can truncate or fail on existing rows, and RunSQL/RunPython
  without reverse operations make the migration irreversible. Once applied in
  production, the data is gone unless a backup exists.

triggers:
  file_patterns:
    - "**/migrations/*.py"
  code_patterns:
    - "RemoveField"
    - "DeleteModel"
    - "AlterField"
    - "RenameField"
    - "RunSQL"
    - "RunPython"

checklist:
  - Does RemoveField/DeleteModel drop data that is still referenced by code, reports, or compliance requirements - and was it migrated elsewhere first?
  - Can the AlterField type/size change truncate values or fail on existing rows (CharField shrink, float->int, text->varchar)?
  - Is code still deployed (old app servers during rolling deploy) that writes the field being removed?
  - Do RunPython/RunSQL operations have working reverse functions, or is irreversibility explicit (RunPython.noop documented)?
  - Is the destructive step separated from the data-preserving step so it can be applied later, after verification and backup?

fix: |
  Sequence destructive changes: (1) stop writing the field in code, (2) copy
  data with a RunPython migration if needed, (3) remove the field in a later
  release once verified. Provide reverse functions for RunPython/RunSQL. Take a
  backup or snapshot before applying destructive migrations in production.

tags:
  - migrations
  - data-integrity
  - safety

examples:
  bad: |
    operations = [
        migrations.RemoveField(
            model_name='user',
            name='legacy_id',  # Data dropped immediately and forever!
        ),
    ]
  good: |
    # Release N: copy the data first, reversibly
    operations = [
        migrations.RunPython(copy_legacy_id_to_external_ref,
                             reverse_code=copy_external_ref_to_legacy_id),
    ]
    # Release N+1 (after verification): remove the old field
    # operations = [migrations.RemoveField('user', 'legacy_id')]
