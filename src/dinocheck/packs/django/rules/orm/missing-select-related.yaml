id: django/missing-select-related
name: Missing select_related
level: major
category: performance
description: |
  Accessing ForeignKey or OneToOne field without using select_related()
  causes additional database queries.

triggers:
  file_patterns:
    - "**/*.py"
  code_patterns:
    - "\\.objects\\.(all|filter|get)\\("

checklist:
  - ForeignKey access without select_related
  - OneToOne field access in loop

fix: Add select_related('field_name') to the queryset.

tags:
  - performance
  - orm

examples:
  bad: |
    invoices = Invoice.objects.filter(status="open")
    for invoice in invoices:
        print(invoice.customer.email)  # one extra query per invoice
  good: |
    invoices = Invoice.objects.filter(status="open").select_related("customer")
    for invoice in invoices:
        print(invoice.customer.email)  # customer already joined
