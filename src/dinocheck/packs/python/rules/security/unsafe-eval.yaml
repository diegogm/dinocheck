id: python/unsafe-eval
name: Unsafe eval/exec Usage
level: critical
category: security
description: |
  Detects eval(), exec(), and compile() on dynamically built strings. If any
  part of the evaluated string can be influenced by users, configuration, or
  external data, this is arbitrary code execution inside your process. Even on
  "internal" input it is fragile: a safer parser almost always exists.
  (Unsafe deserializers like pickle are covered by python/insecure-deserialization.)

triggers:
  file_patterns:
    - "**/*.py"
  code_patterns:
    - "\\beval\\("
    - "\\bexec\\("
    - "(?<!re\\.)\\bcompile\\(\\s*[\"'f]"

checklist:
  - Can the string passed to eval/exec contain content from users, HTTP requests, files, environment, or config?
  - Is eval used merely to parse data - would json.loads() or ast.literal_eval() do the same safely?
  - Is eval used for dynamic dispatch - would a dict mapping names to functions do the same safely?
  - If dynamic execution is genuinely required (plugin system), is the input restricted to a strict allowlist or sandboxed?

fix: |
  Replace eval on data with json.loads() or ast.literal_eval(). Replace
  eval-based dispatch with an explicit dict of allowed operations
  ({"add": operator.add}[name]). For arithmetic expressions, use a dedicated
  expression parser. If exec is unavoidable, hardcode the executed code and
  never interpolate external strings into it.

tags:
  - security
  - code-execution
  - injection

examples:
  bad: |
    def run_expression(expr):
        return eval(expr)  # User-controlled input executes arbitrary code
  good: |
    import ast
    import operator

    OPS = {"add": operator.add, "sub": operator.sub}

    def run_expression(expr):
        data = ast.literal_eval(expr)  # data only, no code execution
        return OPS[data["op"]](*data["args"])
