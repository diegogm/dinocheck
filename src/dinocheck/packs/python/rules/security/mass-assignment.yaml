id: python/mass-assignment
name: Mass Assignment Vulnerability
level: critical
category: security
description: |
  Detects HTTP request data spread directly into model creation or updates
  (Model.objects.create(**request.data)), letting clients set any field they
  name - including is_admin, role, owner, or balance. Only report when the
  spread values come from an HTTP request: **kwargs plumbing, config dicts, and
  os.environ data are internal and NOT mass assignment.

triggers:
  file_patterns:
    - "**/*.py"
  code_patterns:
    - "\\*\\*request\\.(data|json|POST|GET)"
    - "\\.create\\(\\*\\*"
    - "\\.update\\(\\*\\*"
    - "setattr\\(.*request\\."
    - "objects\\.update_or_create\\(\\*\\*"

checklist:
  - Is request.data / request.POST / a parsed HTTP body spread (**) into .create(), .update(), update_or_create(), or a model constructor?
  - Could a client include privileged fields in the payload - is_admin, is_staff, role, owner, user_id, price, balance?
  - Is there an allowlist between the request and the model (explicit field extraction, or a serializer/schema with declared fields)?
  - Does a setattr loop over request-supplied keys write arbitrary attributes onto a model or user object?
  - Does the spread data actually come from an HTTP request? Internal dicts, config, environ, and **kwargs pass-through are safe - do not report.

fix: |
  Extract fields explicitly (email=data["email"], name=data["name"]) or validate
  through a serializer/schema whose fields are an explicit allowlist, then pass
  only validated fields to the model. Set privileged fields (owner, role) from
  server-side context, never from the payload.

tags:
  - security
  - mass-assignment
  - injection

examples:
  bad: |
    def create_user(request):
        user = User.objects.create(**request.data)
        # Attacker can send {"is_admin": true}!
        return user
  good: |
    def create_user(request):
        user = User.objects.create(
            email=request.data['email'],
            name=request.data['name'],
            # is_admin NOT settable from request
        )
        return user
