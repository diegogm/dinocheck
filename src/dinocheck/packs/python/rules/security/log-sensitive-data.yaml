id: python/log-sensitive-data
name: Sensitive Data in Logs
level: critical
category: security
description: |
  Detects passwords, tokens, API keys, PII, and payment data written to logs via
  logging calls or print(). Logs are broadly readable (developers, aggregators,
  third-party services) and retained for long periods, so a logged credential is
  a leaked credential and logged PII is a compliance incident.

triggers:
  file_patterns:
    - "**/*.py"
  code_patterns:
    - "log(ger)?\\.(debug|info|warning|error|critical|exception)"
    - "logging\\.(debug|info|warning|error|critical|exception)"
    - "print\\(.*(password|token|secret|key|card|ssn)"

checklist:
  - Does any log/print statement interpolate a password, token, API key, session ID, or signature value?
  - Are whole objects or payloads logged (request.data, user.__dict__, headers, kwargs) that contain credentials or PII inside?
  - Is PII (email, phone, SSN, address, card number) logged where a stable opaque ID would serve for debugging?
  - Do exception logs embed the sensitive arguments that were being processed when the error occurred?
  - At debug level, would enabling it in production dump secrets (verbose request/response logging)?

fix: |
  Log opaque identifiers instead of values: user IDs not emails, token prefixes
  (token[:4] + "...") not tokens, last-4 not full card numbers. Never log whole
  request bodies or headers; select fields explicitly. Add a logging filter that
  redacts known sensitive keys as a safety net.

tags:
  - security
  - logging
  - pii
  - data-exposure

examples:
  bad: |
    logger.info(f"User login: {username} with password {password}")
    logger.debug(f"API request: {request.data}")  # Body contains secrets
    logger.error(f"Payment failed for card {card_number}")
  good: |
    logger.info("User login: %s", username)
    logger.debug("API request to %s", request.path)
    logger.error("Payment failed for card ending in %s", card_number[-4:])
