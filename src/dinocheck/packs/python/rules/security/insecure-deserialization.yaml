id: python/insecure-deserialization
name: Insecure Deserialization
level: blocker
category: security
description: |
  Detects deserialization of potentially untrusted data with formats that can
  execute code on load: pickle, marshal, shelve, dill, jsonpickle, and
  yaml.load without SafeLoader. If an attacker can influence the serialized
  bytes (uploads, cookies, cache entries, message queues), deserializing them
  is remote code execution. (Direct eval/exec is covered by python/unsafe-eval.)

triggers:
  file_patterns:
    - "**/*.py"
  code_patterns:
    - "pickle\\.loads?\\("
    - "yaml\\.load\\("
    - "yaml\\.(unsafe_load|full_load)"
    - "marshal\\.loads?\\("
    - "shelve\\.open"
    - "dill\\.loads?\\("
    - "jsonpickle\\.decode"

checklist:
  - Can the deserialized bytes originate outside the process - user uploads, HTTP bodies, cookies, shared caches, queues, or files another party can write?
  - Is yaml.load() called without Loader=yaml.SafeLoader (yaml.safe_load is the safe form)?
  - Could data serialized by a trusted producer be tampered with in transit or at rest (unsigned cache/session blobs)?
  - Could the format be JSON or another data-only format instead - is arbitrary object graph support actually needed?
  - If pickle between trusted services is unavoidable, is the payload authenticated (HMAC-signed) before loading?

fix: |
  Use JSON (or another data-only format) for anything crossing a trust boundary.
  Replace yaml.load() with yaml.safe_load(). If pickle is truly required between
  trusted components, sign payloads with hmac and verify with
  hmac.compare_digest() before unpickling.

tags:
  - security
  - deserialization
  - rce

examples:
  bad: |
    import pickle

    def load_session(session_data):
        return pickle.loads(base64.b64decode(session_data))
        # Attacker-controlled cookie -> arbitrary code execution

    config = yaml.load(user_config_file)  # Unsafe loader!
  good: |
    import json

    def load_session(session_data):
        return json.loads(base64.b64decode(session_data))

    config = yaml.safe_load(user_config_file)
