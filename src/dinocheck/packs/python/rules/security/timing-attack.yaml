id: python/timing-attack
name: Timing Attack Vulnerability
level: critical
category: security
description: |
  Detects secrets - tokens, API keys, HMAC signatures, password hashes -
  compared with == or !=. String comparison returns at the first differing
  byte, so response times reveal how many leading characters matched, letting a
  remote attacker recover the secret incrementally. Only comparisons of secret
  material matter; ordinary string equality is fine.

triggers:
  file_patterns:
    - "**/*.py"
  code_patterns:
    - "(?i)(token|secret|password|passwd|api_key|hash|signature|digest|hmac).{0,40}[=!]="
    - "(?i)[=!]=.{0,40}(token|secret|password|api_key|hash|signature|digest)"
    - "hmac\\.new\\("

checklist:
  - Is a token, API key, signature, or hash compared using == or != instead of a constant-time function?
  - Is the compared value secret material an attacker would want to recover (not a public ID or enum that merely contains "key" in its name)?
  - Can an attacker trigger the comparison repeatedly and observe timing (HTTP endpoint, webhook verification)?
  - Are HMAC/webhook signatures verified with hmac.compare_digest() over bytes/str of the same type?
  - Are password checks delegated to a proper hash library (bcrypt/argon2/check_password) rather than comparing digests manually?

fix: |
  Use hmac.compare_digest(expected, received) (or secrets.compare_digest) for
  all token and signature comparisons; ensure both arguments are the same type
  (both str or both bytes). For passwords, use a password-hashing library's
  verify function instead of comparing hashes yourself.

tags:
  - security
  - cryptography
  - timing-attack

examples:
  bad: |
    def verify_webhook(request):
        expected = compute_signature(request.body)
        if request.headers['X-Signature'] == expected:  # Timing attack!
            process_webhook(request)
  good: |
    import hmac

    def verify_webhook(request):
        expected = compute_signature(request.body)
        received = request.headers['X-Signature']
        if hmac.compare_digest(expected, received):
            process_webhook(request)
