id: python/unvalidated-redirect
name: Unvalidated Redirect (Open Redirect)
level: major
category: security
description: |
  Detects redirects whose target URL comes from user input (typically a ?next=
  or return_url parameter) without host validation. Attackers craft links on
  your trusted domain that bounce victims to a phishing site, and open
  redirects can also be chained to steal OAuth tokens or bypass URL allowlists.

triggers:
  file_patterns:
    - "**/*.py"
  code_patterns:
    - "redirect\\("
    - "HttpResponseRedirect"
    - "RedirectView"
    - "[\"'](next|return_url|redirect_to|callback_url|continue)[\"']"

checklist:
  - Does the redirect target come from a query parameter, form field, or header (next, return_url, referer)?
  - Is the URL validated against the app's own host(s), e.g. with Django's url_has_allowed_host_and_scheme()?
  - Are absolute URLs (https://evil.com), protocol-relative URLs (//evil.com), and backslash tricks (/\evil.com) rejected?
  - Is there a safe fallback destination when validation fails, instead of trusting the raw value?
  - Is this redirect part of an auth/OAuth flow where an open redirect leaks tokens or codes in the fragment/query?

fix: |
  Validate before redirecting: in Django, use
  url_has_allowed_host_and_scheme(next_url, allowed_hosts={request.get_host()},
  require_https=True) and fall back to a fixed path ('/') when it fails.
  Prefer redirecting to named routes or an allowlist of internal paths over
  accepting arbitrary URLs.

tags:
  - security
  - redirect
  - phishing

examples:
  bad: |
    def login_view(request):
        next_url = request.GET.get('next', '/')
        if authenticate(request):
            return redirect(next_url)  # Open redirect!
        # Attacker link: /login?next=https://evil.com/steal-creds
  good: |
    from django.utils.http import url_has_allowed_host_and_scheme

    def login_view(request):
        next_url = request.GET.get('next', '/')
        if not url_has_allowed_host_and_scheme(next_url, allowed_hosts={request.get_host()}):
            next_url = '/'
        if authenticate(request):
            return redirect(next_url)
