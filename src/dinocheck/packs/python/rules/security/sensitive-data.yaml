id: python/sensitive-data
name: Sensitive Data Exposure
level: major
category: security
description: |
  Detects secrets and PII exposed through API responses, serialized payloads, or
  insecure storage: password hashes and tokens returned in JSON, credentials
  written to plaintext files, or sensitive fields included in exported data.
  Merely naming a variable "password" is NOT an issue - only actual exposure is.
  (Logging exposure is covered by python/log-sensitive-data; committed secrets
  by python/hardcoded-secrets.)

triggers:
  file_patterns:
    - "**/*.py"
  code_patterns:
    - "(?i)[\"'](password|passwd|token|secret|api_key|ssn|card_number)\\w*[\"']\\s*:"
    - "(?i)return .{0,60}\\b(password|token|secret|api_key)"
    - "(?i)\\.write\\(.{0,60}(password|token|secret|api_key)"
    - "(?i)json\\.dumps?\\(.{0,60}(password|token|secret)"

checklist:
  - Does an API response, serialized dict, or export include passwords, hashes, tokens, API keys, or session identifiers?
  - Is PII (SSN, full card numbers, addresses) returned or stored where the consumer doesn't need it?
  - Are credentials written to plaintext files, spreadsheets, or unencrypted storage?
  - Is the exposure reachable by parties who shouldn't see the data (other users, client-side code, third parties)?
  - Is it just a variable named "password" being used internally (verification, env loading)? That is correct handling - do not report.

fix: |
  Strip sensitive fields before returning or storing data: build response dicts
  from an explicit allowlist of fields, mark serializer fields write_only, and
  mask identifiers (last 4 digits) when partial display is needed. Store
  credentials only in secret managers or encrypted storage.

tags:
  - security
  - secrets
  - pii

examples:
  bad: |
    def profile_view(request):
        user = request.user
        return JsonResponse({
            "email": user.email,
            "password_hash": user.password,   # exposes the hash!
            "api_token": user.api_token,      # exposes a live credential!
        })
  good: |
    def profile_view(request):
        user = request.user
        return JsonResponse({
            "email": user.email,
            "date_joined": user.date_joined.isoformat(),
        })
