id: python/sql-injection
name: SQL Injection Review
level: blocker
category: security
description: |
  Detects SQL queries built by interpolating values into the query string with
  f-strings, .format(), % formatting, or concatenation. If any interpolated
  value can be influenced by a user, the attacker rewrites the query - reading,
  modifying, or deleting arbitrary data. Parameterized queries
  (execute(query, params) with a separate params argument) are safe by design:
  do NOT report them.

triggers:
  file_patterns:
    - "**/*.py"
  code_patterns:
    - "execute\\(\\s*f[\"']"
    - "(?i)f[\"'].{0,40}(SELECT|INSERT|UPDATE|DELETE|WHERE)\\b"
    - "(?i)[\"'].{0,60}(SELECT|INSERT INTO|UPDATE|DELETE FROM).{0,80}[\"']\\s*(%|\\+|\\.format)"
    - "\\.raw\\("
    - "(?i)query\\s*=.*(%s|\\{).*(SELECT|FROM|WHERE)"

checklist:
  - Is the SQL string built with an f-string, .format(), % formatting, or + concatenation that embeds a variable?
  - Can any embedded value originate from user input (HTTP params/body, headers, CLI args, file uploads), directly or through intermediate variables?
  - Does execute() receive values as a separate params argument? If yes, it is parameterized and SAFE - do not report.
  - For dynamic identifiers (table/column names, ORDER BY), is there a strict allowlist? Identifiers cannot be parameterized.
  - For Model.objects.raw() or extra(), are all values passed via the params argument rather than interpolated?

fix: |
  Pass values as parameters: cursor.execute("SELECT ... WHERE name = %s", [name])
  and Model.objects.raw(sql, params=[...]). For dynamic table/column names or
  sort directions, map user input through a hardcoded allowlist dict. Never
  interpolate request-derived strings into SQL, even "just for internal tools".

tags:
  - security
  - sql
  - injection

examples:
  bad: |
    # User input directly in query
    query = f"SELECT * FROM users WHERE name = '{name}'"
    cursor.execute(query)
  good: |
    # Parameterized query
    cursor.execute("SELECT * FROM users WHERE name = %s", [name])
