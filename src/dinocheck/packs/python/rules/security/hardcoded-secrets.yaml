id: python/hardcoded-secrets
name: Hardcoded Secrets Detection
level: critical
category: security
description: |
  Detects real credentials committed to source code: API keys, passwords,
  tokens, and private keys assigned as string literals. Anything committed is
  exposed to everyone with repo access and lives forever in git history;
  placeholders and obvious test values are fine, live-looking values are not.

triggers:
  file_patterns:
    - "**/*.py"
  code_patterns:
    - "(?i)(api_key|apikey|api_secret|password|passwd|secret|token|auth)\\s*=\\s*[\"'][^\"']{6,}"
    - "sk-[A-Za-z0-9_-]{8,}"
    - "AKIA[0-9A-Z]{16}"
    - "ghp_[A-Za-z0-9]{20,}"
    - "Bearer [A-Za-z0-9._-]{10,}"
    - "-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----"

checklist:
  - Is the assigned value a plausible live credential (high-entropy string, provider prefix like sk-/AKIA/ghp_) rather than a placeholder like "changeme" or "your-key-here"?
  - Is the value used to authenticate against a real external service or production system?
  - Is the file committed to version control (not a gitignored local config or .env)?
  - Is this clearly test/fixture data (mock server keys, documented dummy values)? If so, do not report.
  - If a real secret was committed, does it need rotation - removal from the file alone does not purge git history?

fix: |
  Load secrets at runtime from the environment (os.environ["API_KEY"]) or a
  secrets manager, with python-dotenv for local development and .env gitignored.
  Rotate any credential that was ever committed - deleting the line does not
  remove it from history.

tags:
  - security
  - secrets
  - credentials

examples:
  bad: |
    API_KEY = "sk-1234567890abcdef"
    client = OpenAI(api_key="sk-real-key-here")
  good: |
    API_KEY = os.environ["API_KEY"]
    client = OpenAI(api_key=os.environ["OPENAI_API_KEY"])
