id: python/error-handling
name: Error Handling Review
level: major
category: error-handling
description: |
  Reviews whether each try/except block handles errors appropriately for its
  context: what is caught, what is swallowed, and what the caller learns.
  A linter flags bare excepts; this rule judges the strategy - silently ignoring
  a cache miss is fine, silently ignoring a payment failure loses money.

triggers:
  file_patterns:
    - "**/*.py"
  code_patterns:
    - "except .*:"
    - "try:"

checklist:
  - Does `except Exception` or a bare except swallow failures in business-critical operations (payments, writes, notifications)?
  - Is the caught exception type specific to what the try block can actually raise, or does it also hide unrelated bugs (TypeError, KeyError)?
  - When an error is caught, is it logged with enough context (IDs, operation) or re-raised - or does it vanish with `pass`?
  - Are transient failures (network, DB timeouts) either retried or propagated, rather than treated as permanent?
  - Does the except block leave the system in a consistent state (rollbacks, cleanup) before continuing?

fix: |
  Catch the narrowest exception type the operation can raise. Decide explicitly
  per site: ignore (only for genuinely optional operations, with a comment),
  log-and-degrade, retry with backoff, or wrap and re-raise with `raise ... from e`.
  Never `except Exception: pass` around code whose failure matters.

tags:
  - error-handling
  - reliability

examples:
  bad: |
    try:
        process_payment(order)
    except Exception:
        pass  # Payment failure silently ignored!
  good: |
    try:
        process_payment(order)
    except PaymentGatewayError as e:
        logger.error("Payment failed for order %s: %s", order.id, e)
        raise OrderProcessingError("Payment failed") from e
