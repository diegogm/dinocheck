id: python/blocking-in-async
name: Blocking Call in Async Context
level: major
category: reliability
description: |
  Detects synchronous blocking calls inside `async def` functions: time.sleep(),
  requests/urllib HTTP calls, blocking file I/O, subprocess.run(), or sync DB
  drivers. One blocking call freezes the entire event loop, stalling every other
  coroutine in the process - the service degrades globally, not just this handler.

triggers:
  file_patterns:
    - "**/*.py"
  code_patterns:
    - "async def"
    - "await "

checklist:
  - Is time.sleep() used inside an async function instead of await asyncio.sleep()?
  - Are HTTP requests made with requests/urllib instead of an async client (httpx.AsyncClient, aiohttp)?
  - Is blocking file I/O (open/read/write of large files) or subprocess.run() executed directly in a coroutine?
  - Are synchronous database drivers or ORMs called without an async driver or a thread offload?
  - For unavoidable sync calls, are they wrapped in asyncio.to_thread() / run_in_executor()?

fix: |
  Replace blocking calls with async equivalents: time.sleep -> asyncio.sleep,
  requests -> httpx.AsyncClient/aiohttp, subprocess.run ->
  asyncio.create_subprocess_exec, file I/O -> aiofiles. Wrap unavoidable
  synchronous calls in asyncio.to_thread() so the event loop keeps running.

tags:
  - reliability
  - async
  - performance

examples:
  bad: |
    async def fetch_data():
        time.sleep(1)  # Blocks the entire event loop!
        response = requests.get(url)  # Also blocks!
        return response.json()
  good: |
    async def fetch_data():
        await asyncio.sleep(1)
        async with httpx.AsyncClient() as client:
            response = await client.get(url)
        return response.json()
