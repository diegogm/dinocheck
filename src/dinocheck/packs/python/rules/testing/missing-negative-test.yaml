id: python/missing-negative-test
name: Missing Negative Test Cases
level: major
category: testing
description: |
  Detects test suites that only exercise the happy path of the code under test:
  no invalid inputs, no error responses, no boundary values, no permission
  denials. Error-handling code that is never tested is where regressions hide,
  and it is exactly the code that runs during incidents.

triggers:
  file_patterns:
    - "**/test_*.py"
    - "**/*_test.py"
    - "**/tests.py"
    - "**/tests/**/*.py"
  code_patterns:
    - "def test_"
    - "class Test\\w+"

checklist:
  - For each tested operation, is there at least one test with invalid/malformed input asserting the failure behavior?
  - Are error statuses (400/401/403/404/409) asserted for endpoints, not just the 2xx path?
  - Are exception paths exercised (pytest.raises / assertRaises) for functions that can raise?
  - Are boundary values covered - empty collections, zero, negatives, maximum sizes, None?
  - If the code enforces permissions or uniqueness, is the denied/duplicate case tested?

fix: |
  For each behavior, add the mirror-image negative test: invalid input asserting
  the specific error, denied permission asserting 401/403, duplicate asserting
  409/IntegrityError, and boundary values (empty, zero, max). Name them after
  the failure they verify (test_create_user_invalid_email).

tags:
  - testing
  - coverage
  - edge-cases

examples:
  bad: |
    class TestUserAPI:
        def test_create_user(self):
            response = client.post('/users/', {'email': 'test@example.com'})
            assert response.status_code == 201
        # No tests for: invalid email, duplicate user, missing fields
  good: |
    class TestUserAPI:
        def test_create_user(self):
            response = client.post('/users/', {'email': 'test@example.com'})
            assert response.status_code == 201

        def test_create_user_invalid_email(self):
            response = client.post('/users/', {'email': 'invalid'})
            assert response.status_code == 400

        def test_create_user_duplicate(self):
            client.post('/users/', {'email': 'test@example.com'})
            response = client.post('/users/', {'email': 'test@example.com'})
            assert response.status_code == 409

        def test_create_user_missing_email(self):
            response = client.post('/users/', {})
            assert response.status_code == 400
