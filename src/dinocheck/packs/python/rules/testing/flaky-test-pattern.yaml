id: python/flaky-test-pattern
name: Flaky Test Pattern Detection
level: major
category: testing
description: |
  Detects test constructs that make results depend on the environment instead of
  the code: real clocks and sleeps, unseeded randomness, live network calls,
  and state shared between tests. These tests pass locally and fail
  intermittently in CI, eroding trust until real failures get ignored too.

triggers:
  file_patterns:
    - "**/test_*.py"
    - "**/*_test.py"
    - "**/tests.py"
    - "**/tests/**/*.py"
  code_patterns:
    - "time\\.sleep"
    - "datetime\\.(now|today|utcnow)"
    - "random\\.(random|randint|choice|shuffle|sample)"
    - "requests\\.(get|post|put|delete)"
    - "httpx\\.(get|post|Client|AsyncClient)"
    - "uuid\\.uuid4"

checklist:
  - Does the test use time.sleep() to wait for something instead of polling a condition or controlling the clock?
  - Do assertions depend on the real current time/date (datetime.now, token expiry, "today" boundaries)?
  - Is unseeded randomness (random.*, uuid4) used in a way that can change the asserted outcome between runs?
  - Does the test hit real external services (HTTP, email, third-party APIs) instead of mocks/fakes?
  - Does the test rely on state left by other tests (module globals, shared DB rows, class attributes), so order matters?

fix: |
  Freeze time with freezegun or inject a clock. Seed randomness or pass fixed
  values. Mock external calls (responses, respx, unittest.mock). Give each test
  its own fixtures and clean up shared state; run with pytest-randomly to catch
  order dependencies. Replace sleeps with explicit waits on conditions.

tags:
  - testing
  - flaky
  - reliability

examples:
  bad: |
    def test_token_expiry(self):
        token = create_token()
        time.sleep(2)  # Flaky: timing-dependent
        self.assertTrue(token.is_expired())

    def test_send_notification(self):
        result = send_email("test@example.com")  # Calls real service!
        self.assertTrue(result)
  good: |
    @freeze_time("2024-01-01 12:00:00")
    def test_token_expiry(self):
        token = create_token()
        with freeze_time("2024-01-01 12:05:00"):
            self.assertTrue(token.is_expired())

    @patch('myapp.email.send_email')
    def test_send_notification(self, mock_send):
        mock_send.return_value = True
        result = send_email("test@example.com")
        self.assertTrue(result)
