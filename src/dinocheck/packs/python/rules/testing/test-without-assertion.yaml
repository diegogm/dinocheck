id: python/test-without-assertion
name: Test Without Assertion
level: major
category: testing
description: |
  Detects test functions that call code but never assert anything about the
  result. Such tests only fail if the code raises, so they green-light wrong
  return values, wrong side effects, and silent no-ops - inflating coverage
  numbers while verifying nothing.

triggers:
  file_patterns:
    - "**/test_*.py"
    - "**/*_test.py"
    - "**/tests.py"
    - "**/tests/**/*.py"
  code_patterns:
    - "def test_"
    - "async def test_"

checklist:
  - Does each test_ function contain at least one assert, self.assert*, pytest.raises, or mock .assert_called* verification?
  - If the test's value is "doesn't raise", is that intent explicit (a comment, or asserting the returned object's basic properties)?
  - Are assertions unreachable (inside an if/for that may not execute, or after an early return)?
  - Would this test still pass if the function returned None, wrong values, or wrote nothing? What outcome should it pin down?

fix: |
  Assert the observable outcome: returned values (assert result == expected),
  raised errors (with pytest.raises(...)), state changes (DB row exists, file
  written), or dependency calls (mock.assert_called_once_with(...)). If a test
  genuinely only checks "does not crash", say so in its name and a comment.

tags:
  - testing
  - quality
  - assertions

examples:
  bad: |
    def test_create_user():
        user = create_user("john", "john@example.com")
        # Test passes but verifies nothing!
  good: |
    def test_create_user():
        user = create_user("john", "john@example.com")
        assert user.name == "john"
        assert user.email == "john@example.com"
