id: python/mutable-default-arg
name: Mutable Default Argument
level: major
category: correctness
description: |
  Detects mutable default arguments (list, dict, set) in function definitions.
  Defaults are evaluated once at definition time, so a mutable default is shared
  across every call: mutations from one call leak into the next, producing
  state that accumulates unpredictably and bugs that only appear on repeat calls.

triggers:
  file_patterns:
    - "**/*.py"
  code_patterns:
    - "def .+=\\s*\\[\\s*\\]"
    - "def .+=\\s*\\{\\s*\\}"
    - "def .+=\\s*(list|dict|set)\\(\\)"

checklist:
  - Does any parameter default to [], {}, set(), list(), or dict()?
  - Is the parameter mutated (append, update, add, item assignment) inside the function or by callees?
  - Does the function store or return the default, letting callers mutate the shared object later?
  - Would replacing the default with None plus an in-function initialization change observable behavior?

fix: |
  Use None as the default sentinel and create the object inside the function:

  def foo(items=None):
      if items is None:
          items = []

  If sharing was intentional (memoization), make it explicit with a module-level
  cache or functools.lru_cache instead of a default argument.

tags:
  - correctness
  - python
  - gotcha

examples:
  bad: |
    def add_item(item, items=[]):
        items.append(item)
        return items
    # add_item(1) returns [1]
    # add_item(2) returns [1, 2]  # Unexpected!
  good: |
    def add_item(item, items=None):
        if items is None:
            items = []
        items.append(item)
        return items
