id: python/inverted-condition
name: Inverted Condition Detection
level: critical
category: correctness
description: |
  Detects conditions whose polarity contradicts the action taken in the branch,
  such as granting access when a permission check fails or treating an error
  flag as success. Negated conditions and double negatives are a frequent source
  of authorization bypasses and inverted business behavior.

triggers:
  file_patterns:
    - "**/*.py"
  code_patterns:
    - "if not .+:"
    - "if .+ != .+:"
    - "while not .+:"
    - "if not .+ and not .+"

checklist:
  - Does an "if not <permission/auth>" branch perform the privileged action instead of denying it?
  - Does an "if <error/failure>" branch run the success path (or vice versa)?
  - Does the branch body semantically match what the variable name in the condition implies?
  - Are there double negatives (if not is_not_valid) that likely flipped the intended logic?
  - In if/else pairs, would swapping the branches make the names and actions align?

fix: |
  Flip the condition or swap the if/else branches so the action matches the
  condition's meaning. Prefer positive condition names (is_valid over is_not_valid)
  and eliminate double negatives. Add a test asserting the denied/negative path.

tags:
  - correctness
  - security
  - logic

examples:
  bad: |
    if not user.has_permission:
        allow_access()  # Inverted! Allows when no permission
    else:
        deny_access()
  good: |
    if user.has_permission:
        allow_access()
    else:
        deny_access()
