id: python/n-squared-hidden
name: Hidden O(n²) Complexity
level: major
category: performance
description: |
  Detects accidentally quadratic code: linear-time operations (membership test
  against a list, list.index()/list.count(), removal by value) executed inside a
  loop over the same data, or nested loops that a set/dict would eliminate. The
  code looks innocent and is fast in tests, then degrades sharply as data grows.

triggers:
  file_patterns:
    - "**/*.py"
  code_patterns:
    - "\\.index\\("
    - "\\.count\\("
    - "for .+ in .+:\\n(.+\\n){0,8}?\\s+(if .+ in |for .+ in )"
    - "\\.remove\\("

checklist:
  - Is `x in some_list` (a linear scan) evaluated inside a loop where a set would give O(1) lookups?
  - Is list.index(), list.count(), or list.remove() called inside a loop over the same or a related collection?
  - Do nested loops pair up items that a dict keyed by the join field would match in one pass?
  - Is a string or list built by repeated + / += inside a loop instead of a list plus ''.join()?
  - Roughly how large can the collection get - is quadratic behavior actually reachable in production?

fix: |
  Build a set or dict once before the loop and test membership against it.
  Replace pair-matching nested loops with a dict keyed by the matching field.
  Accumulate strings in a list and ''.join() at the end. Only optimize where
  the input can realistically grow.

tags:
  - performance
  - complexity
  - correctness

examples:
  bad: |
    def find_duplicates(items):
        duplicates = []
        for item in items:
            if items.count(item) > 1 and item not in duplicates:
                duplicates.append(item)
        return duplicates  # O(n²): count() and `in list` are both O(n)
  good: |
    def find_duplicates(items):
        seen = set()
        duplicates = set()
        for item in items:
            if item in seen:
                duplicates.add(item)
            seen.add(item)
        return list(duplicates)  # O(n): set operations are O(1)
