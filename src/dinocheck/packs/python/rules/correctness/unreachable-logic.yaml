id: python/unreachable-logic
name: Unreachable Logic Detection
level: major
category: correctness
description: |
  Detects branches that can never execute because their condition contradicts an
  enclosing or earlier check (e.g. `if not x` nested inside `if x`), or elif arms
  shadowed by an earlier equivalent condition. Unlike dead code after return that
  linters catch, these require understanding what the conditions mean - and they
  usually indicate the author intended something else.

triggers:
  file_patterns:
    - "**/*.py"
  code_patterns:
    - "if (.+):\\n\\s*if not \\1"
    - "if not (.+):\\n\\s*if \\1"
    - "elif (.+):(.+\\n){0,6}?\\s*elif \\1:"
    - "if .+ and not .+:"

checklist:
  - Is a condition tested inside a branch that already guarantees its opposite (x and then not x)?
  - In an if/elif chain, is any arm's condition already implied or excluded by an earlier arm, making it dead?
  - Given earlier returns/raises/guards, can this branch's condition still be true when execution reaches it?
  - Does a compound condition contain contradictory terms (a and not a) or terms made redundant by prior checks?
  - If the branch is unreachable, what did the author probably intend - is the real bug a wrong condition elsewhere?

fix: |
  Determine the intended behavior first: often the fix is correcting the
  condition, not deleting the branch. Remove genuinely dead branches. If a
  never-true check is kept deliberately as defense-in-depth, replace it with an
  assertion or add a comment explaining why it exists.

tags:
  - correctness
  - logic
  - dead-code

examples:
  bad: |
    def process(user):
        if user.is_admin:
            if not user.is_admin:  # Can never be true!
                log_security_event()
            grant_access()
  good: |
    def process(user):
        if user.is_admin:
            grant_access()
        else:
            log_security_event()
