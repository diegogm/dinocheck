id: python/missing-edge-case
name: Missing Edge Case Handling
level: major
category: correctness
description: |
  Detects operations that crash or misbehave on legitimate edge inputs: division
  by len() of an empty collection, indexing [0]/[-1] on possibly-empty sequences,
  max()/min() on empty iterables, or None flowing into attribute access. These
  failures typically surface in production with real data rather than in
  happy-path tests.

triggers:
  file_patterns:
    - "**/*.py"
  code_patterns:
    - "/\\s*len\\("
    - "\\[(0|-1)\\]"
    - "\\b(max|min)\\("
    - "\\.pop\\(\\)"
    - "\\.split\\(.*\\)\\["

checklist:
  - Can a division by len(x) or another denominator receive an empty collection or zero?
  - Is [0], [-1], .pop() or next() applied to a sequence/iterator that may be empty?
  - Is max()/min() called on an iterable that may be empty, without a default= argument?
  - Can None reach this code and hit attribute access or arithmetic?
  - Are negative numbers, empty strings, or whitespace-only strings meaningful inputs here, and are they handled?

fix: |
  Guard with an early return or explicit check before the risky operation
  (if not items: return ...). Use max(items, default=...) and
  next(it, default). Make None-tolerance explicit with Optional type hints
  and validate at the function boundary.

tags:
  - correctness
  - edge-cases
  - robustness

examples:
  bad: |
    def average(numbers):
        return sum(numbers) / len(numbers)  # ZeroDivisionError on empty list
  good: |
    def average(numbers):
        if not numbers:
            return 0.0
        return sum(numbers) / len(numbers)
