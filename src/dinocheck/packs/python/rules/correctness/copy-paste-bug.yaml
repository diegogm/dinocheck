id: python/copy-paste-bug
name: Copy-Paste Bug Detection
level: critical
category: correctness
description: |
  Detects duplicated code blocks where one occurrence was not fully adapted: a
  variable, attribute, field name, or constant left over from the original copy.
  These bugs are syntactically valid and pass review easily because the lines
  look intentionally similar, yet they silently corrupt data or skip logic.

triggers:
  file_patterns:
    - "**/*.py"
  code_patterns:
    - "\\w+\\.\\w+\\s*=.*\\n\\s*\\w+\\.\\w+\\s*="
    - "elif .+ == .+:"
    - "(\\w+)\\[[\"']\\w+[\"']\\]\\s*=.*\\n\\s*\\1\\[[\"']\\w+[\"']\\]\\s*="

checklist:
  - In blocks of near-identical consecutive lines, is exactly the right variable/attribute changed on each line?
  - In if/elif chains comparing similar values, does each branch use the value it tests (not a copy of a sibling branch)?
  - When a computed value aggregates several parts (total = a + b + ...), is every part that was computed actually included?
  - Do left-hand and right-hand sides pair up correctly (e.g. x.min = compute_min(), not compute_max())?
  - If a function was duplicated and renamed, was its body fully updated to match the new name?

fix: |
  Compare each duplicated line against its siblings and fix the element that was
  not adapted. If the same shape repeats 3+ times, replace the copies with a loop,
  a dict mapping, or a parameterized helper so the inconsistency cannot recur.

tags:
  - correctness
  - bug
  - code-smell

examples:
  bad: |
    def process_order(order):
        order.total = calculate_total(order)
        order.tax = calculate_tax(order)
        order.shipping = calculate_shipping(order)
        order.total = order.total + order.tax  # Forgot to add shipping!
  good: |
    def process_order(order):
        order.total = calculate_total(order)
        order.tax = calculate_tax(order)
        order.shipping = calculate_shipping(order)
        order.total = order.total + order.tax + order.shipping
