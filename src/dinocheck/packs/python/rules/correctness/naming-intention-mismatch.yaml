id: python/naming-intention-mismatch
name: Naming vs Intention Mismatch
level: major
category: correctness
description: |
  Detects functions whose name promises one behavior while the body does another:
  getters that mutate state, is_/has_ predicates returning non-booleans, or
  create_ functions that may return existing objects. Callers trust these naming
  conventions without reading the implementation, so the mismatch produces bugs
  far from the function itself.

triggers:
  file_patterns:
    - "**/*.py"
  code_patterns:
    - "def (get_|fetch_|find_|load_|read_)"
    - "def (set_|update_|save_|write_|store_)"
    - "def (is_|has_|can_|should_|check_)"
    - "def (create_|delete_|remove_|add_)"

checklist:
  - Does a get_/fetch_/find_/load_ function write, save, or otherwise mutate state as a side effect?
  - Does an is_/has_/can_/should_ function return something other than a bool (objects, strings, None-or-value)?
  - Does a create_ function sometimes return an existing object, or a delete_ function only soft-flag it, without the name saying so?
  - Are there side effects (network calls, cache writes, logging out users) that no reader would expect from the name?
  - Would a caller relying only on the name and signature use this function incorrectly?

fix: |
  Either rename the function to describe what it really does (get_user ->
  get_or_create_user, delete_account -> deactivate_account) or split the side
  effect into a separate, explicitly named function. Keep get_* pure, make
  is_/has_* return bool, and reserve create_* for unconditional creation.

tags:
  - correctness
  - naming
  - readability

examples:
  bad: |
    def get_user(user_id):
        user = User.objects.get(id=user_id)
        user.last_accessed = now()  # Side effect in getter!
        user.save()
        return user
  good: |
    def get_user(user_id):
        return User.objects.get(id=user_id)

    def record_user_access(user_id):
        user = User.objects.get(id=user_id)
        user.last_accessed = now()
        user.save()
        return user
