id: python/stale-todo
name: Stale TODO/FIXME Detection
level: minor
category: maintainability
description: |
  Evaluates TODO, FIXME, HACK, XXX, and BUG comments for severity and staleness.
  Most are harmless notes, but some mark disabled security checks, known crashes,
  or shortcuts that were meant to be temporary. The goal is to surface the
  dangerous ones before they ship, not to ban TODO comments.

triggers:
  file_patterns:
    - "**/*.py"
  code_patterns:
    - "(?i)#\\s*(TODO|FIXME|HACK|XXX|BUG|SECURITY)\\b"

checklist:
  - Does the comment mark disabled or bypassed security/auth behavior (escalate to a security finding, not a note)?
  - Does it describe a known crash, data corruption, or incorrect result that is currently reachable?
  - Does the adjacent code actually contain the temporary shortcut the comment warns about, and would shipping it be harmful?
  - Is the item actionable right now (no ticket reference, no owner) versus tracked and safely deferred?
  - Is the comment stale - does it reference code or conditions that no longer exist?

fix: |
  Fix security-related and known-bug items before shipping. For legitimate
  deferrals, add a ticket reference and context: "# TODO(PROJ-123): ...".
  Delete TODOs that no longer apply. Never leave auth bypasses or debug
  shortcuts guarded only by a comment.

tags:
  - maintainability
  - technical-debt
  - documentation

examples:
  bad: |
    # FIXME: This bypasses authentication for testing
    def login(request):
        return User.objects.first()  # Security issue!

    # TODO: Handle the case where user is None
    def get_profile(user):
        return user.profile  # Will crash!
  good: |
    # TODO(PROJ-123): Add caching for performance optimization
    def get_settings():
        return Settings.objects.get(pk=1)
