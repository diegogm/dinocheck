id: python/misleading-comment
name: Misleading Comment Detection
level: minor
category: maintainability
description: |
  Detects comments and docstrings that contradict the code they describe:
  docstrings promising behavior the function doesn't implement, parameter or
  return descriptions that no longer match the signature, and inline comments
  describing removed logic. Readers act on these claims without re-reading the
  code, so a wrong comment reliably produces wrong callers.

triggers:
  file_patterns:
    - "**/*.py"
  code_patterns:
    - '""".+"""'
    - "'''.+'''"
    - "(?i)#.*\\b(should|must|always|never|returns?|ensures?|apply|applies|handles?|note|assumes?)\\b"

checklist:
  - Does the docstring claim behavior (discounts, retries, validation, defaults) that the body does not implement?
  - Do documented parameters, types, and return values match the actual signature and returns?
  - Do inline comments describe what the adjacent code actually does now, or an earlier version of it?
  - When a comment and its code disagree, which one is right - is the comment stale, or is the code missing intended behavior?

fix: |
  Decide whether the comment or the code expresses the intent. If the comment is
  stale, update or delete it. If the comment documents intended behavior that
  was never implemented (or was lost in an edit), fix the code and add a test.
  Prefer comments that explain WHY over comments restating WHAT.

tags:
  - maintainability
  - documentation
  - correctness

examples:
  bad: |
    def calculate_total(items):
        """Returns the sum of all item prices with tax."""
        # Apply 10% discount for members  <-- No discount in code!
        return sum(item.price for item in items)
  good: |
    def calculate_total(items):
        """Returns the sum of all item prices (no tax, no discounts)."""
        return sum(item.price for item in items)
