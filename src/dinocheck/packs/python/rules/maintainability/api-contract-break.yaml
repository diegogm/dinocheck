id: python/api-contract-break
name: API Contract Breaking Change
level: major
category: compatibility
description: |
  Detects changes to public functions, methods, and classes that break existing
  callers: new required parameters, removed/renamed public symbols, changed
  return types, or exceptions raised where none were before. The code itself is
  correct in isolation - the bug appears in every caller that was written
  against the old contract.

triggers:
  file_patterns:
    - "**/*.py"
  code_patterns:
    - "def \\w+\\(\\w+, \\w+, \\w+"
    - "__all__"
    - "@property"
    - "def \\w+\\(self, \\w+, \\w+"

checklist:
  - Was a parameter added without a default value to a function that existing code already calls?
  - Was a public function, method, class, or attribute removed or renamed without updating or deprecating all call sites?
  - Did the return type or shape change (e.g. now returns None or a different structure) in a way existing callers don't expect?
  - Did the exceptions raised change, so existing except clauses no longer catch failures?
  - For externally consumed packages, is the break versioned/deprecated, and for internal code, were ALL callers updated in this change?

fix: |
  Give new parameters a default value that preserves old behavior. For internal
  code, update every caller in the same change (search for all usages). For
  published APIs, emit DeprecationWarning for one release before removing, and
  document the breaking change in the changelog with a major version bump.

tags:
  - compatibility
  - api
  - breaking-change

examples:
  bad: |
    # Before: def send_email(to, subject, body)
    # After: breaking change - new required parameter!
    def send_email(to, subject, body, priority):
        ...
  good: |
    def send_email(to, subject, body, priority="normal"):
        ...  # New parameter has a default, backward compatible
