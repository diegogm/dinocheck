id: react/inline-objects-jsx
name: Inline Object Creation in JSX
level: minor
category: performance
description: |
  Detects object or array literals created inline in JSX props (style={{...}},
  options={[...]}). Each render allocates a new reference, so memoized children
  (React.memo, PureComponent) and dependency-compared hooks see a "changed"
  prop and re-render or re-run even though the values are identical.

triggers:
  file_patterns:
    - "**/*.jsx"
    - "**/*.tsx"
  code_patterns:
    - 'style=\{\{'
    - '\w+=\{\{'
    - '\w+=\{\['

checklist:
  - Are object or array literals written directly inside JSX props (e.g. style={{ ... }}, config={{ ... }})?
  - Is the receiving component memoized (React.memo) or does it use the prop in a dependency array, so the fresh reference actually causes work?
  - Is the literal static (could be hoisted to a module-level constant) or derived (could be wrapped in useMemo)?
  - For style objects, could a CSS class replace the inline object?

fix: |
  Hoist static literals to module-level constants outside the component.
  Memoize derived objects with useMemo keyed on their inputs. Replace static
  inline style objects with CSS classes. Only bother where the consumer is
  memoized or the prop feeds a dependency array; inline literals on plain DOM
  elements are usually harmless.

tags:
  - performance
  - rendering
  - jsx

examples:
  bad: |
    function Banner({ text }) {
      return (
        <div style={{ padding: 20, backgroundColor: 'blue' }}>
          <Text config={{ bold: true, size: 'large' }}>{text}</Text>
        </div>
      );
    }
  good: |
    const bannerStyle = { padding: 20, backgroundColor: 'blue' };
    const textConfig = { bold: true, size: 'large' };

    function Banner({ text }) {
      return (
        <div style={bannerStyle}>
          <Text config={textConfig}>{text}</Text>
        </div>
      );
    }
