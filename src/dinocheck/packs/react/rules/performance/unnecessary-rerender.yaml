id: react/unnecessary-rerender
name: Unnecessary Component Re-render
level: minor
category: performance
description: |
  Detects render-time work that defeats memoization and causes avoidable
  re-renders: inline arrow functions passed to memoized children, values
  recomputed on every render (filter/sort inside JSX), and unstable context
  values. On large lists or expensive subtrees this turns every keystroke
  into a full re-render cascade.

triggers:
  file_patterns:
    - "**/*.jsx"
    - "**/*.tsx"
  code_patterns:
    - 'on[A-Z]\w+=\{\s*\([^)]*\)\s*=>'
    - 'on[A-Z]\w+=\{\s*\w+\s*=>'
    - '=\{\s*\w+\.(filter|map|sort|slice|reduce)\('

checklist:
  - Are inline arrow functions passed as props to memoized components or components rendering expensive subtrees?
  - Are arrays/objects computed inline in JSX (items.filter(...) inside a prop) on every render?
  - Would useCallback (for handlers) or useMemo (for computations) give the child a stable reference?
  - Is a context Provider value re-created on each render ({{ ... }} inline), re-rendering all consumers?
  - Is the receiving component actually memoized? If nothing compares references, the inline function is fine.

fix: |
  Wrap handlers passed to memoized children in useCallback, and expensive or
  reference-compared computations in useMemo. Memoize context values before
  passing them to a Provider. Apply React.memo to pure children that receive
  stable props. Do not memoize blindly: only where a profiler or a memoized
  consumer justifies it.

tags:
  - performance
  - rendering
  - memoization

examples:
  bad: |
    function Parent({ items }) {
      return items.map(item => (
        <ExpensiveChild
          key={item.id}
          onClick={() => handleClick(item.id)}
          data={items.filter(i => i.category === item.category)}
        />
      ));
    }
  good: |
    function Parent({ items }) {
      const handleItemClick = useCallback((id) => {
        handleClick(id);
      }, []);

      const itemsByCategory = useMemo(() => {
        return groupByCategory(items);
      }, [items]);

      return items.map(item => (
        <ExpensiveChild
          key={item.id}
          onClick={handleItemClick}
          data={itemsByCategory[item.category]}
        />
      ));
    }
