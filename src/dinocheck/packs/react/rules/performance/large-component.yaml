id: react/large-component
name: Large Component Should Be Split
level: minor
category: maintainability
description: |
  Detects components that have grown too large and mix several
  responsibilities: many useState/useEffect hooks, data fetching, business
  logic, and hundreds of lines of JSX in one function. Such components are
  hard to test and reuse, re-render as one monolithic block, and every change
  risks breaking unrelated sections.

triggers:
  file_patterns:
    - "**/*.jsx"
    - "**/*.tsx"
  code_patterns:
    - '(?:\buseState[<(][\s\S]*?){4}'
    - '(?:\buseEffect\([\s\S]*?){4}'

checklist:
  - Is the component several hundred lines long or does its JSX render clearly separable sections?
  - Does it manage 4+ pieces of unrelated state or 3+ unrelated useEffect hooks?
  - Does it mix data fetching, business logic, and presentation in one body?
  - Could each visual section become its own child component with a narrow props interface?
  - Could related state + effects be extracted into a custom hook (useXxx)?

fix: |
  Split by responsibility: extract each visual section into a child component,
  move data fetching and related state into custom hooks (e.g. useUsers(),
  useAnalytics()), and keep the parent as a thin composition layer. Group
  state that changes together; unrelated state belongs in the child that uses
  it.

tags:
  - maintainability
  - architecture
  - components

examples:
  bad: |
    function Dashboard() {
      const [users, setUsers] = useState([]);
      const [posts, setPosts] = useState([]);
      const [analytics, setAnalytics] = useState(null);
      const [filters, setFilters] = useState({});
      const [sortBy, setSortBy] = useState('date');
      // ... 300+ lines of mixed logic and JSX
      return (
        <div>
          {/* User list section */}
          {/* Posts section */}
          {/* Analytics charts */}
          {/* Filters sidebar */}
        </div>
      );
    }
  good: |
    function Dashboard() {
      return (
        <div>
          <UserList />
          <PostsFeed />
          <AnalyticsCharts />
          <FiltersSidebar />
        </div>
      );
    }
