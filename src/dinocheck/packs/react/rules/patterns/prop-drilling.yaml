id: react/prop-drilling
name: Excessive Prop Drilling
level: minor
category: maintainability
description: |
  Detects props threaded through multiple intermediate components that never
  use them, only forward them. Every rename or type change then touches the
  whole chain, intermediate components gain false dependencies, and the data
  flow becomes hard to trace and refactor.

triggers:
  file_patterns:
    - "**/*.jsx"
    - "**/*.tsx"
  code_patterns:
    - '\b(\w+)=\{\1\}'
    - '\.\.\.(props|rest)\b'
    - '\(\{\s*\w+(\s*,\s*\w+){4,}'

checklist:
  - Is the same prop passed down through 3 or more component levels?
  - Do intermediate components receive the prop only to forward it, without reading it?
  - Are broad spreads ({...props}, {...rest}) used to blindly relay many values?
  - Would React Context (or a state/store hook) let the consumer read the value directly?
  - Would composition (passing the ready-made element as children) remove the intermediate hops?

fix: |
  For data needed at several depths (current user, theme, locale), create a
  Context with a provider near the data source and read it with useContext in
  the consumer. Alternatively, restructure with composition: build the inner
  element where the data lives and pass it down as children, so intermediate
  layers stay data-agnostic. Reserve drilling for 1-2 levels.

tags:
  - maintainability
  - architecture
  - props

examples:
  bad: |
    function App() {
      const [user, setUser] = useState(null);
      return <Layout user={user} />;
    }
    function Layout({ user }) {
      return <Sidebar user={user} />;  // Just forwarding
    }
    function Sidebar({ user }) {
      return <UserMenu user={user} />;  // Just forwarding
    }
    function UserMenu({ user }) {
      return <span>{user.name}</span>;
    }
  good: |
    const UserContext = createContext(null);

    function App() {
      const [user, setUser] = useState(null);
      return (
        <UserContext.Provider value={user}>
          <Layout />
        </UserContext.Provider>
      );
    }
    function UserMenu() {
      const user = useContext(UserContext);
      return <span>{user.name}</span>;
    }
