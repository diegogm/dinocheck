id: react/index-as-key
name: Array Index as Key
level: major
category: correctness
description: |
  Detects the array index used as the key prop in dynamically rendered lists.
  When items are inserted, removed, or reordered, index keys make React match
  old and new elements by position instead of identity, so component state,
  focus, and uncontrolled input values end up attached to the wrong rows.

triggers:
  file_patterns:
    - "**/*.jsx"
    - "**/*.tsx"
  code_patterns:
    - 'key=\{\s*(i|idx|index)\s*\}'
    - 'key=\{[^}]*\b(index|idx)\b'
    - '\.map\(\s*\(\s*\w+\s*,\s*(i|idx|index)\b'

checklist:
  - Is the array index (or a variable named i, idx, index) used as the key, directly or in a template string?
  - Can this list be reordered, filtered, or have items inserted/removed at runtime?
  - Do list items hold state, focus, animations, or uncontrolled inputs that would be misassigned on reorder?
  - Does each item carry a unique, stable identifier (id, uuid, slug) that could be used instead?
  - Is this a truly static, append-only list where an index key is acceptable?

fix: |
  Use a unique, stable identifier from the data as the key (item.id,
  item.uuid, a natural key like a slug). If none exists, generate one when
  the data is created or fetched (e.g. crypto.randomUUID() at insertion
  time), never during render.

tags:
  - correctness
  - rendering
  - lists

examples:
  bad: |
    function TaskList({ tasks }) {
      return (
        <ul>
          {tasks.map((task, index) => (
            <TaskItem key={index} task={task} />
          ))}
        </ul>
      );
    }
  good: |
    function TaskList({ tasks }) {
      return (
        <ul>
          {tasks.map(task => (
            <TaskItem key={task.id} task={task} />
          ))}
        </ul>
      );
    }
