id: react/useeffect-fetch
name: Data Fetching Without Cleanup
level: minor
category: reliability
description: |
  Detects data fetching inside useEffect without cancellation or an ignore
  flag in the cleanup. When dependencies change quickly or the component
  unmounts, responses can arrive out of order and a slower, older request can
  overwrite newer data (a race condition), or state is set on an unmounted
  component.

triggers:
  file_patterns:
    - "**/*.jsx"
    - "**/*.tsx"
  code_patterns:
    - 'useEffect\([\s\S]{0,300}?(fetch\(|axios\b|\.get\(|\.post\()'

checklist:
  - Is fetch() or an HTTP client called inside useEffect?
  - Does the effect return a cleanup function at all?
  - Does the cleanup abort the request (AbortController) or set an ignore flag checked before setState?
  - If the effect re-runs with new dependencies (e.g. a changing id or query), can an older response overwrite a newer one?
  - Would a data-fetching library (React Query, SWR) or a framework loader fit better than a hand-rolled effect?

fix: |
  Create an AbortController inside the effect, pass controller.signal to
  fetch, and call controller.abort() in the cleanup; swallow only AbortError.
  If the client cannot be aborted, use a `let ignore = false` flag set to
  true in the cleanup and check it before every setState. For anything
  non-trivial, prefer React Query or SWR, which handle races, caching, and
  retries.

tags:
  - reliability
  - data-fetching
  - effects

examples:
  bad: |
    function UserProfile({ userId }) {
      const [user, setUser] = useState(null);
      useEffect(() => {
        fetch(`/api/users/${userId}`)
          .then(r => r.json())
          .then(setUser);  // Stale response can win the race
      }, [userId]);
      return <div>{user?.name}</div>;
    }
  good: |
    function UserProfile({ userId }) {
      const [user, setUser] = useState(null);
      useEffect(() => {
        const controller = new AbortController();
        fetch(`/api/users/${userId}`, { signal: controller.signal })
          .then(r => r.json())
          .then(setUser)
          .catch(e => {
            if (e.name !== 'AbortError') throw e;
          });
        return () => controller.abort();
      }, [userId]);
      return <div>{user?.name}</div>;
    }
