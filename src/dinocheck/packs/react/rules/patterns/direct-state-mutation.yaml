id: react/direct-state-mutation
name: Direct State Mutation
level: critical
category: correctness
description: |
  Detects direct mutation of React state (push/splice/sort on state arrays,
  property assignment on state objects) instead of producing a new value for
  the setter. React compares references to decide when to re-render, so a
  mutated state keeps the same reference: the UI silently goes stale, updates
  get lost, and memoized children never refresh.

triggers:
  file_patterns:
    - "**/*.jsx"
    - "**/*.tsx"
  code_patterns:
    - 'useState[\s\S]{0,600}?\.(push|splice|pop|shift|unshift|sort|reverse|fill)\('
    - '\w+\.(sort|reverse)\('
    - '(state|props)\.\w+\s*=[^=]'

checklist:
  - Is a state array mutated in place with push(), splice(), pop(), shift(), or unshift()?
  - Is a state array (or a prop array) sorted/reversed in place with sort() or reverse() instead of on a copy?
  - Is a property assigned directly on a state object (state.x = ... or obj.field = ... where obj is state)?
  - Is the same (mutated) reference then passed back to the setter, so React skips the re-render?
  - Is a new array/object created (spread, map, filter, toSorted) before calling the setter?

fix: |
  Never mutate state in place. Build a new value and pass it to the setter:
  setItems(prev => [...prev, newItem]) instead of push;
  setItems(prev => [...prev].sort(cmp)) (or prev.toSorted(cmp)) instead of
  sort; setUser(prev => ({ ...prev, name })) instead of assigning a property.
  For deeply nested state, consider Immer (useImmer) or restructuring state.

tags:
  - correctness
  - state
  - immutability

examples:
  bad: |
    function TodoList() {
      const [todos, setTodos] = useState([]);
      const addTodo = (text) => {
        todos.push({ text, done: false });  // Mutates state directly!
        setTodos(todos);  // Same reference, won't re-render
      };
      return <ul>{todos.map(t => <li key={t.text}>{t.text}</li>)}</ul>;
    }
  good: |
    function TodoList() {
      const [todos, setTodos] = useState([]);
      const addTodo = (text) => {
        setTodos(prev => [...prev, { text, done: false }]);
      };
      return <ul>{todos.map(t => <li key={t.text}>{t.text}</li>)}</ul>;
    }
