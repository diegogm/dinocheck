id: react/missing-form-labels
name: Missing Form Input Labels
level: major
category: accessibility
description: |
  Detects form controls (input, select, textarea) without an associated label.
  Screen readers rely on labels to announce the purpose of each field; without
  one, users with visual impairments cannot know what to type. Placeholders are
  not a substitute because they disappear on input and are often skipped by
  assistive technology. This violates WCAG 2.1 Level A (Guideline 1.3.1).

triggers:
  file_patterns:
    - "**/*.jsx"
    - "**/*.tsx"
  code_patterns:
    - '<input\b'
    - '<select\b'
    - '<textarea\b'

checklist:
  - Does every input/select/textarea have an accessible name (label, aria-label, or aria-labelledby)?
  - Is a <label> connected via htmlFor matching the control's id, or does it wrap the control?
  - Is a placeholder being used as the only label (it should not be)?
  - For custom input components, is the label association preserved in the rendered HTML?
  - Are inputs of type hidden/submit/button correctly excluded from this requirement?

fix: |
  Add a <label htmlFor="fieldId"> next to each control and give the control a
  matching id, or wrap the control inside the <label>. When no visible label
  is wanted (e.g. a search box with an icon), add aria-label to the control
  instead. Keep the placeholder as a hint, never as the label.

tags:
  - accessibility
  - wcag
  - forms

examples:
  bad: |
    function LoginForm() {
      return (
        <form>
          <input type="email" placeholder="Email" />
          <input type="password" placeholder="Password" />
          <button type="submit">Log In</button>
        </form>
      );
    }
  good: |
    function LoginForm() {
      return (
        <form>
          <label htmlFor="email">Email</label>
          <input id="email" type="email" />
          <label htmlFor="password">Password</label>
          <input id="password" type="password" />
          <button type="submit">Log In</button>
        </form>
      );
    }
