id: react/missing-alt-text
name: Missing Image Alt Text
level: major
category: accessibility
description: |
  Detects img elements and Image components rendered without an alt attribute.
  Alt text is what screen readers announce and what browsers show when an image
  fails to load; omitting it makes visual content invisible to users with
  visual impairments and violates WCAG 2.1 Level A (Guideline 1.1.1).

triggers:
  file_patterns:
    - "**/*.jsx"
    - "**/*.tsx"
  code_patterns:
    - '<img\b'
    - '<Image\b'

checklist:
  - Does every <img> and <Image> element have an alt attribute?
  - Is the alt text descriptive of the image's purpose (not filler like "image", "photo", or the filename)?
  - For purely decorative images, is alt="" used explicitly (empty string, not a missing attribute)?
  - Do wrapper/custom Image components accept and forward alt to the underlying img?
  - Is dynamic alt text (e.g. alt={user.name}) guaranteed to be non-empty for meaningful images?

fix: |
  Add a descriptive alt attribute to every img/Image element, describing the
  content or function of the image in context. For decorative images that
  convey no information, use alt="" so screen readers skip them. Never omit
  the attribute entirely.

tags:
  - accessibility
  - wcag
  - images

examples:
  bad: |
    function Avatar({ user }) {
      return (
        <div>
          <img src={user.avatarUrl} />
          <img src="/icons/star.png" />
        </div>
      );
    }
  good: |
    function Avatar({ user }) {
      return (
        <div>
          <img src={user.avatarUrl} alt={`${user.name}'s avatar`} />
          <img src="/icons/star.png" alt="" />  {/* Decorative */}
        </div>
      );
    }
