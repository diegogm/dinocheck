id: react/user-input-injection
name: Unsanitized User Input Rendering
level: critical
category: security
description: |
  Detects code paths that let user input escape React's auto-escaping:
  eval()/new Function() on user data, direct innerHTML/document.write
  assignments, or insertAdjacentHTML with concatenated strings. Any of these
  turns user-controlled text into executable script or markup (XSS / code
  injection), bypassing the protection JSX normally provides.

triggers:
  file_patterns:
    - "**/*.jsx"
    - "**/*.tsx"
  code_patterns:
    - '\beval\('
    - 'new Function\('
    - '\.(innerHTML|outerHTML)\s*='
    - 'insertAdjacentHTML\('
    - 'document\.write'

checklist:
  - Is user input (props, form values, URL params) ever passed to eval() or new Function()?
  - Is innerHTML/outerHTML assigned or insertAdjacentHTML called with strings containing user data?
  - Is document.write() used with any dynamic content?
  - Is DOM manipulated directly (refs, getElementById) with HTML strings instead of going through JSX?
  - If raw HTML is genuinely required, is it sanitized with DOMPurify right before insertion?

fix: |
  Render all user-provided text through JSX expressions ({value}), which
  escape automatically. Replace eval/new Function with data structures
  (lookup maps, JSON.parse). Replace innerHTML/document.write with React
  state-driven rendering, or element.textContent for plain text; if raw HTML
  is unavoidable, sanitize with DOMPurify first.

tags:
  - security
  - xss
  - injection

examples:
  bad: |
    function SearchResults({ query }) {
      // eval with user input
      const result = eval(query);
      // innerHTML bypass
      document.getElementById('output').innerHTML = query;
      return <div>{result}</div>;
    }
  good: |
    function SearchResults({ query }) {
      const [results, setResults] = useState([]);
      useEffect(() => {
        fetchResults(query).then(setResults);
      }, [query]);
      return (
        <div>
          <p>Results for: {query}</p>
          {results.map(r => <div key={r.id}>{r.text}</div>)}
        </div>
      );
    }
