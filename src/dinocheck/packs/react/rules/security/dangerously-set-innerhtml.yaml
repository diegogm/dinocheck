id: react/dangerously-set-innerhtml
name: Unsafe dangerouslySetInnerHTML
level: critical
category: security
description: |
  Detects dangerouslySetInnerHTML fed with unsanitized content. The prop
  bypasses React's escaping and injects raw HTML into the DOM, so any user
  input, API response, or URL parameter that reaches it becomes a stored or
  reflected XSS: attacker scripts run with the user's session.

triggers:
  file_patterns:
    - "**/*.jsx"
    - "**/*.tsx"
  code_patterns:
    - 'dangerouslySetInnerHTML'
    - '__html'

checklist:
  - Is dangerouslySetInnerHTML used anywhere in the file?
  - Can the injected HTML originate from user input, URL/query parameters, or an external API?
  - Is the content sanitized with DOMPurify (or equivalent) immediately before injection, with no unsanitized path?
  - Could the same output be achieved with plain JSX or a markdown/HTML renderer that sanitizes by default?
  - If the source is claimed trusted (own CMS), is that trust enforced server-side (sanitize-on-write)?

fix: |
  Prefer rendering content through JSX so React escapes it. If raw HTML is
  unavoidable, sanitize at the last step: DOMPurify.sanitize(html) and pass
  the result to dangerouslySetInnerHTML; configure an allowlist of tags and
  attributes if possible. Never build the HTML string by concatenating user
  input.

tags:
  - security
  - xss
  - html

examples:
  bad: |
    function Comment({ comment }) {
      return (
        <div dangerouslySetInnerHTML={{ __html: comment.body }} />
      );
    }
  good: |
    import DOMPurify from 'dompurify';

    function Comment({ comment }) {
      const sanitized = DOMPurify.sanitize(comment.body);
      return (
        <div dangerouslySetInnerHTML={{ __html: sanitized }} />
      );
    }
