id: react/unsafe-href
name: Unsafe href from User Input
level: critical
category: security
description: |
  Detects anchor tags whose href comes from user-controlled data without
  protocol validation. A stored profile link or API-provided URL of the form
  "javascript:..." executes attacker code on click (XSS); "data:" URLs enable
  phishing payloads. React only logs a warning for javascript: URLs — it still
  renders them.

triggers:
  file_patterns:
    - "**/*.jsx"
    - "**/*.tsx"
  code_patterns:
    - 'href=\{'
    - '(href|url|link):\s*\w+\.'

checklist:
  - Is the href value derived from user input, URL/query parameters, or an API response?
  - Is the URL validated to allow only safe protocols (http:, https:, mailto:, tel:, or relative paths)?
  - "Could a javascript:, data:, or vbscript: URL reach the href unchecked?"
  - Is validation done by parsing (new URL) rather than a bypassable prefix/substring check?
  - Do links with target="_blank" also include rel="noopener noreferrer"?

fix: |
  Validate before rendering: parse with new URL(url, window.location.origin)
  and allow only an explicit protocol allowlist (http:, https:, mailto:);
  fall back to '#' or omit the link otherwise. Do this in one shared helper
  (e.g. isSafeUrl) instead of ad-hoc checks, and add
  rel="noopener noreferrer" to _blank links.

tags:
  - security
  - xss
  - links

examples:
  bad: |
    function UserLink({ url, label }) {
      return <a href={url}>{label}</a>;
    }
    // An attacker can pass url="javascript:alert('XSS')"
  good: |
    function isSafeUrl(url) {
      try {
        const parsed = new URL(url, window.location.origin);
        return ['http:', 'https:', 'mailto:'].includes(parsed.protocol);
      } catch {
        return false;
      }
    }

    function UserLink({ url, label }) {
      const href = isSafeUrl(url) ? url : '#';
      return <a href={href} rel="noopener noreferrer">{label}</a>;
    }
