id: react/exhaustive-deps
name: Missing Hook Dependencies
level: major
category: correctness
description: |
  Detects missing dependencies in useEffect, useLayoutEffect, useMemo, and
  useCallback dependency arrays. When the callback reads a prop, state
  variable, or derived value that is not listed, the hook keeps using the
  value captured on a previous render, producing stale data and effects that
  never re-run when they should.

triggers:
  file_patterns:
    - "**/*.jsx"
    - "**/*.tsx"
  code_patterns:
    - 'useEffect\('
    - 'useLayoutEffect\('
    - 'useMemo\('
    - 'useCallback\('

checklist:
  - Which props, state variables, and locally derived values does the callback read?
  - Are all of them present in the dependency array?
  - Is an empty array ([]) used while the callback clearly reads reactive values?
  - Are functions defined in the component body used inside the hook without being listed (or stabilized with useCallback)?
  - Is a dependency deliberately omitted to "run once" where a ref or an effect-event pattern would be the correct fix?

fix: |
  List every reactive value the callback reads in the dependency array. For
  functions, either move them inside the hook, hoist them out of the
  component, or wrap them in useCallback and list that. To intentionally read
  the latest value without re-triggering the effect, store it in a ref rather
  than lying to the dependency array.

tags:
  - hooks
  - correctness
  - dependencies

examples:
  bad: |
    function SearchResults({ query }) {
      const [results, setResults] = useState([]);
      useEffect(() => {
        fetchResults(query).then(setResults);
      }, []);  // Missing 'query' dependency
      return <ul>{results.map(r => <li key={r.id}>{r.name}</li>)}</ul>;
    }
  good: |
    function SearchResults({ query }) {
      const [results, setResults] = useState([]);
      useEffect(() => {
        fetchResults(query).then(setResults);
      }, [query]);  // All dependencies listed
      return <ul>{results.map(r => <li key={r.id}>{r.name}</li>)}</ul>;
    }
