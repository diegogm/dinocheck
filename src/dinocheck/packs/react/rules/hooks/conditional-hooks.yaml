id: react/conditional-hooks
name: Conditional Hook Call
level: critical
category: correctness
description: |
  Detects hooks called inside conditionals, loops, nested functions, or after
  early returns. React identifies each hook by its call order, which must be
  identical on every render. Calling hooks conditionally shifts that order and
  corrupts state, producing crashes or values assigned to the wrong hook.

triggers:
  file_patterns:
    - "**/*.jsx"
    - "**/*.tsx"
  code_patterns:
    - 'if\s*\([^)]*\)\s*\{[\s\S]{0,150}?\buse(State|Effect|LayoutEffect|Memo|Callback|Ref|Context|Reducer)\('
    - '(for|while)\s*\([^)]*\)\s*\{[\s\S]{0,150}?\buse[A-Z]\w*\('
    - '\?\s*use[A-Z]\w*\('
    - '&&\s*use[A-Z]\w*\('

checklist:
  - Is any hook (useState, useEffect, useMemo, custom useXxx) called inside an if/else block or ternary?
  - Is any hook called inside a loop (for, while, .forEach, .map)?
  - Is any hook called inside a nested function, callback, or event handler?
  - Is there an early return (e.g. `if (!data) return null`) before a later hook call?
  - Would the sequence of hook calls differ between two renders of this component?

fix: |
  Move every hook call to the top level of the component or custom hook,
  before any conditional logic or early return. Put the condition inside the
  hook instead (e.g. guard inside the useEffect callback, or pass the
  condition to the dependency logic). For per-item state in loops, extract a
  child component that calls the hook once.

tags:
  - hooks
  - correctness
  - rules-of-hooks

examples:
  bad: |
    function UserProfile({ userId }) {
      if (userId) {
        const [user, setUser] = useState(null);
        useEffect(() => {
          fetchUser(userId).then(setUser);
        }, [userId]);
      }
      return <div>{user?.name}</div>;
    }
  good: |
    function UserProfile({ userId }) {
      const [user, setUser] = useState(null);
      useEffect(() => {
        if (userId) {
          fetchUser(userId).then(setUser);
        }
      }, [userId]);
      return <div>{user?.name}</div>;
    }
