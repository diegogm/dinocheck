id: vue/missing-key-v-for
name: Missing :key in v-for
level: major
category: templates
description: |
  Detects v-for loops without a :key binding. Without keys Vue patches list
  DOM in place by position, so when items are inserted, removed, or
  reordered, component state and input values stick to the wrong rows. A
  stable key lets Vue track each node's identity across updates.
checklist:
  - Does every v-for element or component have a :key binding?
  - Is the key a unique, stable identifier from the data (id, uuid) rather than the array index?
  - Can the list reorder, filter, or insert/delete items at runtime, making index keys unsafe?
  - When using v-for on <template>, is the :key placed on the <template> tag (Vue 3) or a child (Vue 2)?
  - Do items contain form inputs or stateful components that would leak state across rows without keys?
fix: |
  Add :key with a unique, stable identifier from the item, e.g.
  v-for="user in users" :key="user.id". Avoid :key="index" for lists that
  can change order or length; if the data has no id, generate one when the
  data is created, not during rendering.

tags:
  - vue
  - performance
  - correctness

triggers:
  file_patterns:
    - "**/*.vue"
  code_patterns:
    - '<(?:(?!(?::|v-bind:)key=)[^>])*v-for\s*=(?:(?!(?::|v-bind:)key=)[^>])*>'

examples:
  bad: |
    <li v-for="user in users">{{ user.name }}</li>
  good: |
    <li v-for="user in users" :key="user.id">{{ user.name }}</li>
