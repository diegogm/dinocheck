id: css/color-contrast
name: Potential Color Contrast Issues
level: major
category: accessibility
description: |
  Detects text colors likely to fail WCAG contrast requirements, such as
  light grays on light backgrounds. Low contrast makes text unreadable for
  users with low vision or color deficiencies and for anyone in bright
  light. WCAG 2.1 AA requires 4.5:1 for normal text and 3:1 for large text
  (18px+, or 14px+ bold) and UI components.
triggers:
  file_patterns:
    - "**/*.css"
    - "**/*.scss"
    - "**/*.sass"
    - "**/*.less"
  code_patterns:
    - 'color:\s*#[a-fA-F0-9]'
    - 'color:\s*rgba?\('
    - 'color:\s*hsla?\('
    - 'color:\s*(light)?gr[ae]y'
checklist:
  - Are light grays (#999, #aaa, #bbb, #ccc) or low-opacity colors used for text on light backgrounds?
  - Does each text color have a known background to evaluate against, or is it set without one?
  - Do muted, placeholder, and disabled text styles still reach 4.5:1 (or 3:1 for large text)?
  - Do focus indicators and UI component borders reach 3:1 against adjacent colors?
  - If theming is used, do all theme variants (dark mode) keep sufficient contrast?
fix: |
  Check suspect pairs with a contrast tool (WebAIM Contrast Checker,
  browser DevTools). Darken text or lighten backgrounds until normal text
  reaches 4.5:1 and large text 3:1 — e.g. #767676 is the lightest gray that
  passes 4.5:1 on white. Centralize colors as custom properties so fixes
  apply everywhere, and re-verify each theme.
tags:
  - accessibility
  - wcag
  - color
examples:
  bad: |
    .text-muted {
      color: #999;
    }
    .placeholder {
      color: #ccc;
    }
  good: |
    .text-muted {
      color: #595959; /* 7:1 on white */
    }
    .placeholder {
      color: #767676; /* 4.5:1 on white */
    }
