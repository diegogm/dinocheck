id: css/outline-none
name: Focus Outline Removal
level: major
category: accessibility
description: |
  Detects focus outlines removed (outline: none / 0) without a replacement
  focus style. Keyboard users then have no way to see which element is
  focused, making the page effectively unusable without a mouse. This
  violates WCAG 2.1 Level AA (2.4.7 Focus Visible).
triggers:
  file_patterns:
    - "**/*.css"
    - "**/*.scss"
    - "**/*.sass"
    - "**/*.less"
  code_patterns:
    - 'outline:\s*(none|0)'
    - 'outline-width:\s*0'
    - 'outline-style:\s*none'
checklist:
  - Is outline removed on :focus (or globally) for interactive elements (buttons, links, inputs)?
  - Does the same rule (or another) provide a clearly visible replacement (box-shadow, border, background change)?
  - Does the replacement indicator have at least 3:1 contrast against the surrounding colors?
  - Would :focus-visible achieve the goal (no ring on mouse click, ring kept for keyboard)?
fix: |
  If the goal is hiding the ring on mouse clicks, use :focus-visible instead
  of removing outlines: style button:focus-visible { outline: 2px solid
  currentColor; outline-offset: 2px; } and let :focus without -visible stay
  unstyled. If outline must be replaced, pair every outline:none with a
  visible alternative (e.g. box-shadow ring) in the same selector.
tags:
  - accessibility
  - wcag
  - focus
examples:
  bad: |
    button:focus {
      outline: none;
    }
    a:focus {
      outline: 0;
    }
  good: |
    button:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 2px;
    }
    a:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.5);
    }
