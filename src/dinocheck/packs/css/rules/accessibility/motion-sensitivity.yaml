id: css/motion-sensitivity
name: Motion Without Reduced Motion Support
level: major
category: accessibility
description: |
  Detects animations and transitions defined without a prefers-reduced-motion
  fallback. Large movements, parallax, spinning, and auto-playing animations
  can trigger dizziness and nausea in users with vestibular disorders. WCAG
  2.1 (2.3.3 Animation from Interactions) expects non-essential motion to be
  disableable, and the OS-level signal for that is prefers-reduced-motion.
triggers:
  file_patterns:
    - "**/*.css"
    - "**/*.scss"
    - "**/*.sass"
    - "**/*.less"
  code_patterns:
    - 'animation(-name)?:'
    - '@keyframes'
    - 'transition:'
checklist:
  - Does the file define animations or transitions involving movement (translate, scale, rotate, parallax)?
  - Is there any @media (prefers-reduced-motion) block that disables or reduces them?
  - Are animations continuous/infinite or larger than small UI feedback (those need the fallback most)?
  - Are trivial transitions (color, opacity under ~300ms) correctly left alone (they rarely need it)?
  - Is motion essential to the feature, or purely decorative and safe to remove?
fix: |
  Add a reduced-motion path. Either disable globally:

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  or, better, opt in to motion only when allowed:

  @media (prefers-reduced-motion: no-preference) {
    .element { animation: slide 0.3s ease; }
  }
tags:
  - accessibility
  - wcag
  - motion
  - animation
examples:
  bad: |
    .hero {
      animation: pulse 2s infinite;
    }
  good: |
    .hero {
      animation: pulse 2s infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .hero {
        animation: none;
      }
    }
