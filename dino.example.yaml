# Dinocheck Configuration
# Your vibe coding companion - agent-native AI code critic
#
# Copy this file to dino.yaml and customize for your project
# Documentation: https://github.com/diegogm/dinocheck
#
# Dinocheck is agent-native: your AI coding agent performs the review via
# 'dino brief' + 'dino report'. No API keys, no model configuration.

# Enable language/framework packs (all packs enabled when omitted)
packs:
  - python           # Base Python rules
  - django           # Django framework rules

# Response language (en, es, fr, de, pt, etc.)
language: en

# Analyze only specific directories (default: current directory)
# include_paths:
#   - src/
#   - lib/

# Exclude paths from analysis (glob patterns)
# exclude_paths:
#   - migrations
#   - tests/fixtures
#   - "*.generated.py"

# Disable specific rules
# disabled_rules:
#   - django/bare-except
#   - python/broad-exception
